    box.append(el('div', { class: 'field' }, [el('label', { text: 'Material' }), sel]));

    for (const k of def.size) {
      const cfg = SIZE_FIELDS[k];
      box.append(slider({ ...cfg, value: p[k], onInput: v => { objs.update(e, { [k]: v }); this._refreshMass(); } }).row);
    }

    this.massSlider = slider({ label: 'Mass', min: 0, max: 1, step: 0.001, value: massToSlider(objs.massOf(e) || 1),
      fmt: v => sliderToMass(v).toFixed(2), onInput: v => objs.update(e, { mass: sliderToMass(v) }) });
    box.append(this.massSlider.row);
    this._refreshMass();

    box.append(slider({ label: 'Friction', min: 0, max: 1.5, step: 0.01, value: p.friction ?? m.friction,
      fmt: v => v.toFixed(2), onInput: v => objs.update(e, { friction: v }) }).row);
    box.append(slider({ label: 'Bounciness', min: 0, max: 1, step: 0.01, value: p.restitution ?? m.restitution,
      fmt: v => v.toFixed(2), onInput: v => objs.update(e, { restitution: v }) }).row);

    if (!def.noStatic) {
      box.append(checkbox(def.anchored ? 'Static (rigid planks)' : 'Static (fixed in place)', !!p.isStatic, v => {
        objs.update(e, { isStatic: v }); this.renderInspector();
      }));
    }
    for (const t of def.toggles || []) box.append(checkbox(t.label, !!p[t.key], v => objs.update(e, { [t.key]: v })));
    if (p.isStatic && !def.anchored) box.append(el('p', { class: 'muted', text: 'Drag to move · Q / E or mouse wheel to rotate.', style: 'margin-bottom:8px' }));
    box.append(el('button', { class: 'btn danger wide', text: '🗑 Delete', onclick: () => app.removeEntity(e) }));
  }

  _refreshMass() {
    const e = this.app.selected, s = this.massSlider;
    if (!e || !s) return;
    const allStatic = this.app.objects.bodiesOf(e).every(b => b.isStatic);
    s.input.disabled = allStatic;
    if (allStatic) { s.out.textContent = '∞ (static)'; return; }
    const mass = this.app.objects.massOf(e);
    s.input.value = massToSlider(mass);
    s.out.textContent = mass.toFixed(2);
  }

  /* ---------- Characters ---------- */
  renderCharPanel() {
    const e = this.app.selected, panel = this.$('char-panel');
    if (!e || !e.controller) { panel.classList.add('hidden'); return; }
    panel.classList.remove('hidden');
    this.$('char-name').textContent = e.name;
    for (const b of panel.querySelectorAll('[data-mode]')) b.classList.toggle('active', b.dataset.mode === e.controller.mode);
    this._charStatus();
  }

  _charStatus() {
    const e = this.app.selected;
    if (!e || !e.controller) return;
    const c = e.controller;
    this.$('char-status').textContent = c.stun > 0 && c.mode !== 'fall' ? `Knocked out (${c.stun.toFixed(1)} s)`
      : !c.conscious ? 'Limp' : c.grounded ? 'On the ground' : 'Airborne';
  }

  renderCharList() {
    const list = this.$('char-list'), app = this.app;
    list.innerHTML = '';
    const chars = app.objects.characters();
    if (!chars.length) { list.append(el('p', { class: 'muted', text: 'No ragdolls yet.' })); return; }
    for (const e of chars) {
      list.append(el('div', { class: 'char-item' + (e === app.selected ? ' sel' : ''), onclick: () => app.select(e) }, [
        el('span', { class: 'dot', style: `background:${e.props.shirt}` }),
        el('span', { class: 'name', text: e.name }),
        el('span', { class: 'mode', text: CHARACTER_STATES[e.controller.mode].label }),
        el('button', { class: 'x', title: 'Delete', text: '✕', onclick: (ev) => { ev.stopPropagation(); app.removeEntity(e); } }),
      ]));
    }
  }

  /** Called once per animation frame. */
  frame(dtMs) {
    this._fpsFrames++;
    this._fpsTime += dtMs;
    this._slowTime += dtMs;
    if (this._slowTime >= 250) {
      this._slowTime = 0;
      this._charStatus();
      if (PHYSICS_PRESETS[this.app.presets.active] && PHYSICS_PRESETS[this.app.presets.active].tick) this.syncParams();
    }
    if (this._fpsTime >= 500) {
      this.$('stat-fps').textContent = Math.round(this._fpsFrames * 1000 / this._fpsTime) + ' FPS';
      const objs = this.app.objects;
      const chars = objs.characters().length;
      this.$('status-counts').textContent =
        `${objs.entities.size - chars} objects · ${chars} ragdolls · ${this.app.physics.dynamicBodies().length} moving bodies`;
      this._fpsFrames = 0;
      this._fpsTime = 0;
    }
  }
}

/* =====================================================================
 * Scene — default environment built from OBJECT_DEFS
 * ===================================================================== */
const Scene = {
  buildDefault(objects, physics) {
    const g = physics.groundTop, w = physics.width, cx = w / 2;
    const feet = g - Ragdoll.FOOT_OFFSET - 2;
    // Crate pyramid in the middle.
    for (let row = 0; row < 4; row++)
      for (let col = 0; col < 4 - row; col++)
        objects.spawn('crate', cx - 78 + col * 52 + row * 26, g - 25 - row * 51);
    // Ramp on the left, with a heavy ball waiting at the top.
    const rx = Math.max(130, cx - 360);
    objects.spawn('ramp', rx, g - 34, { flip: true });
    objects.spawn('ball', rx - 60, g - 150);
    // Bridge between two platforms on the right.
    const bx = Math.min(w - 200, cx + 320), by = g - 150;
    objects.spawn('platform', bx - 170, by, { w: 80 });
    objects.spawn('platform', bx + 170, by, { w: 80 });
    objects.spawn('bridge', bx, by - 4, { w: 260 });
    objects.spawn('metalBlock', bx + 60, by - 60);
    // Bouncy pad with a rubber ball above it.
    objects.spawn('bouncyPlatform', cx + 150, g - 8, { w: 100 });
    objects.spawn('rubberBall', cx + 150, g - 300);
    // Two ragdolls: one idling, one walking toward the crates.
    const a = objects.spawn('ragdoll', cx - 200, feet);
    a.controller.dir = 1;
    const b = objects.spawn('ragdoll', bx - 170, by - 9 - Ragdoll.FOOT_OFFSET - 2);
    b.controller.dir = 1;
    b.controller.setMode('walk');
  },
};

/* =====================================================================
 * App — wires managers together and owns the frame loop
 * ===================================================================== */
class App {
  constructor() {
    this.canvas = document.getElementById('world');
    this.viewport = document.getElementById('viewport');
    this.selected = null;
    this.physics = new PhysicsManager();
    this.objects = new ObjectManager(this.physics);
    this.presets = new PresetManager(this);
    this.tools = new ToolManager(this);
    this.renderer = new Renderer(this);
    this.interaction = new InteractionManager(this);
    this.ui = new UIManager(this);

    this.objects.onChange = () => this.ui.renderCharList();
    this.objects.onRebuild = (e) => this.interaction.releaseIfEntity(e);
    this.physics.onSurfaceParamsChanged = () => this.objects.refreshSurfaces();
    this.physics.onWorldShift = (dy) => { for (const e of this.objects.entities.values()) e.origin.y += dy; };
    this.physics.onEscape = (b, broken) => this._recover(b, broken);
    this.physics.onBeforeStep.push(() => {
      const dt = this.physics.stepSeconds;
      this.presets.tick(dt);
      this.tools.applyWind(dt);
      for (const e of this.objects.entities.values()) if (e.controller) e.controller.update(dt);
    });
    Events.on(this.physics.engine, 'collisionStart', (ev) => this._onCollisions(ev));

    this._handleResize();
    new ResizeObserver(() => this._handleResize()).observe(this.viewport);

    Scene.buildDefault(this.objects, this.physics);
    this.ui.renderCharList();
    this._last = performance.now();
    requestAnimationFrame((t) => this._frame(t));
  }

  /** Hard impacts knock ragdolls out. */
  _onCollisions(ev) {
    const ts = PARAMS.timeScale;
    for (const pair of ev.pairs) {
      const a = pair.bodyA.parent, b = pair.bodyB.parent;
      const ea = this.objects.entityOf(a), eb = this.objects.entityOf(b);
      if (!(ea && ea.controller) && !(eb && eb.controller)) continue;
      if (ea === eb) continue;
      const rv = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y) / ts;
      if (rv < CHAR.knockSpeed) continue;
      const secs = clamp(0.8 + (rv - CHAR.knockSpeed) * 0.12, 0.8, 4);
      if (ea && ea.controller) ea.controller.knock(secs);
      if (eb && eb.controller) eb.controller.knock(secs);
    }
  }

  /** Multi-body entities are recovered as a whole so joints never tear. */
  _recover(body, broken) {
    const e = this.objects.entityOf(body);
    if (!e) return false;
    if (e.def.anchored) { this.objects.rebuild(e); return true; }
    const target = { x: this.physics.width / 2, y: 120 };
    if (broken) { this.objects.rebuild(e, target); return true; }
    if (this.objects.bodiesOf(e).length === 1) return false;
    const ref = e.rig ? e.rig.parts.torso : body;
    Composite.translate(e.composite, { x: target.x - ref.position.x, y: target.y - ref.position.y });
    for (const b of this.objects.bodiesOf(e)) { Body.setVelocity(b, { x: 0, y: 0 }); Body.setAngularVelocity(b, 0); }
    return true;
  }

  _handleResize() {
    const r = this.viewport.getBoundingClientRect();
    const w = Math.max(1, Math.floor(r.width)), h = Math.max(1, Math.floor(r.height));
    if (w === this.physics.width && h === this.physics.height && this.physics.boundaries.length) return;
    this.physics.resize(w, h);
    this.renderer.resize(w, h);
  }

  _frame(t) {
    const dt = Math.min(t - this._last, 100);
    this._last = t;
    this.physics.advance(dt);
    this.tools.updateEffects(dt / 1000);
    this.renderer.render(dt / 1000);
    this.ui.frame(dt);
    requestAnimationFrame((t2) => this._frame(t2));
  }

  select(entity) {
    this.selected = entity || null;
    this.renderer.selected = this.selected;
    this.ui.renderInspector();
  }

  removeEntity(entity) {
    this.interaction.releaseIfEntity(entity);
    if (this.renderer.hovered === entity) this.renderer.hovered = null;
    this.objects.remove(entity);
    if (this.selected === entity) this.select(null);
  }

  togglePause() {
    this.physics.paused = !this.physics.paused;
    this.ui.syncPause(this.physics.paused);
  }

  stepOnce() {
    if (this.physics.paused) this.physics.step();
  }

  clearAll() {
    ragdollCounter = 0;
    this.interaction.release();
    this.objects.clear();
    this.physics.clear();
    this.renderer.hovered = null;
    this.select(null);
  }

  reset() {
    this.clearAll();
    this.tools.effects = [];
    Scene.buildDefault(this.objects, this.physics);
    this.ui.renderCharList();
  }
}

window.addEventListener('DOMContentLoaded', () => { window.app = new App(); });
</script>
</body>
</html>
