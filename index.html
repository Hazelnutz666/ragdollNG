<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragdoll Sandbox</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #d8dde6;
    --muted: #7d8595;
    --accent: #4f9dff;
    --accent-2: #2f6fd1;
    --danger: #ff5d5d;
    --toolbar-h: 48px;
    --status-h: 26px;
    --left-w: 230px;
    --right-w: 290px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  #app {
    display: grid; height: 100vh; width: 100vw;
    grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w);
    grid-template-rows: var(--toolbar-h) 1fr var(--status-h);
    grid-template-areas: "top top top" "left view right" "status status status";
  }

  /* ---------- Toolbar ---------- */
  #toolbar { grid-area: top; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; }
  .brand { font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .group { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .spacer { flex: 1; }
  .btn { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; border-color: var(--border); }
  .btn.primary, .btn.active { background: var(--accent-2); border-color: var(--accent); color: #fff; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.wide { width: 100%; margin-top: 8px; }
  .btn.small { padding: 2px 7px; font-size: 12px; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .btn-grid .btn { padding: 6px 4px; font-size: 12px; text-align: left; overflow: hidden; text-overflow: ellipsis; }
  .btn-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .btn-grid.three .btn { text-align: center; }
  .input { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  select.input { cursor: pointer; }
  .stat { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tb-label { color: var(--muted); font-size: 12px; }
  .narrow-only { display: none; }

  /* ---------- Sidebars ---------- */
  .sidebar { background: var(--panel); overflow-y: auto; padding: 8px; }
  #left { grid-area: left; border-right: 1px solid var(--border); }
  #right { grid-area: right; border-left: 1px solid var(--border); }
  .panel { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; margin-bottom: 8px; }
  .panel h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center; }
  .muted { color: var(--muted); margin: 0; font-size: 12px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; margin-bottom: 8px; }
  .row label { font-size: 12px; }
  .row output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
  .row input[type=range]:disabled { opacity: .35; }
  .field { display: grid; grid-template-columns: 80px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12px; }
  .check { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12px; cursor: pointer; }
  .check input { accent-color: var(--accent); }
  .insp-title { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 10px; }
  .sub { font-size: 11px; color: var(--muted); margin: 10px 0 6px; text-transform: uppercase; letter-spacing: .6px; }

  .char-list { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; max-height: 220px; overflow-y: auto; }
  .char-item { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; font-size: 12px; }
  .char-item:hover { background: var(--panel); }
  .char-item.sel { border-color: var(--accent); background: var(--panel); }
  .char-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .char-item .name { flex: 1; }
  .char-item .mode { color: var(--muted); }
  .char-item .x { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
  .char-item .x:hover { color: var(--danger); }

  /* ---------- Viewport ---------- */
  #viewport { grid-area: view; position: relative; overflow: hidden; background: #12151b; min-width: 0; min-height: 0; }
  #world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #world.tool-delete { cursor: not-allowed; }
  #world.tool-explode, #world.spawning { cursor: crosshair; }
  #world.dragging { cursor: grabbing; }
  #pause-overlay { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); border: 1px solid var(--border); padding: 4px 14px; border-radius: 999px;
    font-weight: 600; letter-spacing: 2px; font-size: 12px; pointer-events: none; display: none; }
  #viewport.paused #pause-overlay { display: block; }

  /* ---------- Status bar ---------- */
  #statusbar { grid-area: status; display: flex; align-items: center; gap: 16px; padding: 0 12px;
    background: var(--panel); border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  #status-hint { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status-counts { white-space: nowrap; }

  /* ---------- Narrow screens: sidebars become overlays ---------- */
  @media (max-width: 1000px) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "view" "status"; }
    .narrow-only { display: inline-block; }
    .sidebar { position: fixed; top: var(--toolbar-h); bottom: var(--status-h); width: 270px; z-index: 10;
      transition: transform .18s ease; box-shadow: 0 0 24px rgba(0,0,0,.5); }
    #left { left: 0; transform: translateX(-100%); }
    #right { right: 0; transform: translateX(100%); }
    #left.open, #right.open { transform: none; }
    .brand, #toolbar .lbl { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <button class="btn narrow-only" id="btn-left" title="Spawn &amp; environment panel">☰</button>
    <div class="brand">Ragdoll <span>Sandbox</span></div>
    <div class="group">
      <button class="btn primary" id="btn-play" title="Play / Pause (Space)">⏸ <span class="lbl">Pause</span></button>
      <button class="btn" id="btn-step" title="Advance one physics step (only while paused)" disabled>⏭ <span class="lbl">Step</span></button>
      <button class="btn" id="btn-reset" title="Reset environment (R)">⟲ <span class="lbl">Reset</span></button>
    </div>
    <div class="sep"></div>
    <div class="group" id="tool-group"></div>
    <button class="btn" id="btn-wind" title="Toggle wind (W)">🌬 <span class="lbl">Wind</span></button>
    <div class="sep"></div>
    <div class="group">
      <span class="tb-label lbl">Physics</span>
      <select class="input" id="sel-preset" title="Physics preset"></select>
    </div>
    <div class="spacer"></div>
    <div class="stat" id="stat-fps">-- FPS</div>
    <button class="btn narrow-only" id="btn-right" title="Physics &amp; inspector panel">⚙</button>
  </header>

  <aside id="left" class="sidebar">
    <section class="panel">
      <h2>Spawn objects</h2>
      <div id="spawn-list" class="btn-grid"></div>
      <button class="btn danger wide" id="btn-clear" title="Remove every object and ragdoll">🗑 Clear all</button>
    </section>
    <section class="panel">
      <h2>Characters</h2>
      <button class="btn wide" id="btn-spawn-ragdoll" style="margin-top:0">🧍 Spawn ragdoll</button>
      <div class="field" style="margin:8px 0 0">
        <label for="sel-all-mode">Set all to</label>
        <select class="input" id="sel-all-mode"></select>
      </div>
      <div id="char-list" class="char-list"></div>
    </section>
    <section class="panel">
      <h2>Environment</h2>
      <div id="env-controls"></div>
    </section>
  </aside>

  <main id="viewport">
    <canvas id="world"></canvas>
    <div id="pause-overlay">PAUSED</div>
  </main>

  <aside id="right" class="sidebar">
    <section class="panel">
      <h2>Physics</h2>
      <div id="param-list"></div>
      <button class="btn wide" id="btn-realistic">↺ Reset to Realistic Physics</button>
    </section>
    <section class="panel" id="char-panel">
      <h2><span>Character</span><span id="char-name"></span></h2>
      <div id="char-modes" class="btn-grid"></div>
      <div class="sub">Facing</div>
      <div class="btn-grid">
        <button class="btn" id="btn-face-left">◀ Left</button>
        <button class="btn" id="btn-face-right">Right ▶</button>
      </div>
      <p class="muted" id="char-status" style="margin-top:8px"></p>
    </section>
    <section class="panel">
      <h2>Inspector</h2>
      <div id="inspector"></div>
    </section>
  </aside>

  <footer id="statusbar">
    <span id="status-hint"></span>
    <span id="status-counts"></span>
  </footer>
</div>

<script>
'use strict';
const { Engine, Events, Composite, Bodies, Body, Constraint, Query, Vertices, Bounds } = Matter;

/* =====================================================================
 * Helpers
 * ===================================================================== */
const DEG = Math.PI / 180;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const rand = (lo, hi) => lo + Math.random() * (hi - lo);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const normAngle = (a) => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = (c) => clamp(Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt), 0, 255);
  return '#' + ((1 << 24) | (f(n >> 16) << 16) | (f((n >> 8) & 255) << 8) | f(n & 255)).toString(16).slice(1);
}

function bodyParts(b) { return b.parts.length > 1 ? b.parts.slice(1) : [b]; }

function bodyContains(b, p) {
  for (const q of bodyParts(b)) if (Bounds.contains(q.bounds, p) && Vertices.contains(q.vertices, p)) return true;
  return false;
}

/* =====================================================================
 * Config & tunables
 * ===================================================================== */
const CONFIG = {
  STEP_MS: 1000 / 60,        // fixed physics timestep
  MAX_STEPS_PER_FRAME: 5,    // avoid spiral of death after tab switches
  GROUND_H: 40,              // visible ground height (px)
  WALL_T: 200,               // boundary thickness (thick = no tunnelling)
  ESCAPE_MARGIN: 300,        // how far outside the view a body may go before recovery
  MAX_SPEED: 50,             // px / step velocity clamp (keeps joints stable)
  MAX_ANG_SPEED: 0.8,        // rad / step
};
const DTS = CONFIG.STEP_MS * CONFIG.STEP_MS;  // converts per-step² acceleration to Matter force units

/* =====================================================================
 * Global physics parameters + presets (PresetManager applies these)
 * ===================================================================== */
const DEFAULT_PARAMS = {
  gravity: 1, gravityDir: 0, timeScale: 1, airResistance: 0.01,
  frictionMul: 1, bounceAdd: 0, jointStiffness: 0.9, jointDamping: 0.1,
};
const PARAMS = { ...DEFAULT_PARAMS };

const PARAM_DEFS = [
  { key: 'gravity',        label: 'Gravity',           min: 0,   max: 3,    step: 0.01,  fmt: v => v.toFixed(2) + ' g' },
  { key: 'gravityDir',     label: 'Gravity direction', min: -180, max: 180, step: 1,     fmt: v => Math.round(v) + '°' },
  { key: 'timeScale',      label: 'Time scale',        min: 0.1, max: 2,    step: 0.05,  fmt: v => v.toFixed(2) + '×' },
  { key: 'airResistance',  label: 'Air resistance',    min: 0,   max: 0.1,  step: 0.001, fmt: v => v.toFixed(3) },
  { key: 'frictionMul',    label: 'Global friction',   min: 0,   max: 2,    step: 0.01,  fmt: v => '×' + v.toFixed(2) },
  { key: 'bounceAdd',      label: 'Extra bounciness',  min: 0,   max: 1,    step: 0.01,  fmt: v => '+' + v.toFixed(2) },
  { key: 'jointStiffness', label: 'Joint stiffness',   min: 0.1, max: 1,    step: 0.01,  fmt: v => v.toFixed(2) },
  { key: 'jointDamping',   label: 'Joint damping',     min: 0,   max: 0.5,  step: 0.01,  fmt: v => v.toFixed(2) },
];

/** Presets override DEFAULT_PARAMS; `tick` runs every physics step while active. */
const PHYSICS_PRESETS = {
  realistic: { label: 'Realistic',     params: {} },
  moon:      { label: 'Moon gravity',  params: { gravity: 0.165, airResistance: 0 } },
  zero:      { label: 'Zero gravity',  params: { gravity: 0, airResistance: 0.002 } },
  heavy:     { label: 'Heavy gravity', params: { gravity: 2.5 } },
  bouncy:    { label: 'Super bouncy',  params: { bounceAdd: 0.85 } },
  slippery:  { label: 'Low friction',  params: { frictionMul: 0.04 } },
  chaos: {
    label: 'Chaos mode',
    params: { gravity: 1.3, bounceAdd: 0.5, frictionMul: 0.4, timeScale: 1.2 },
    // Swinging gravity and random explosions.
    tick(pm, dt) {
      const app = pm.app, t = (pm.t += dt);
      app.physics.setParam('gravityDir', Math.round(70 * Math.sin(t * 0.35) + 20 * Math.sin(t * 1.1)));
      if (t > pm.nextEvent) {
        pm.nextEvent = t + rand(2.5, 5);
        const w = app.physics.width, g = app.physics.groundTop;
        app.tools.explode({ x: rand(w * 0.15, w * 0.85), y: rand(g - 220, g - 20) }, 45, 170);
      }
    },
  },
};

/* =====================================================================
 * Materials — physical presets that objects reference by key.
 * Add an entry here and it shows up in the inspector automatically.
 * ===================================================================== */
const MATERIALS = {
  wood:   { label: 'Wood',   density: 0.0008, friction: 0.6,  restitution: 0.15, color: '#a0703c' },
  metal:  { label: 'Metal',  density: 0.006,  friction: 0.35, restitution: 0.05, color: '#7d8794' },
  stone:  { label: 'Stone',  density: 0.0025, friction: 0.8,  restitution: 0.05, color: '#6f6a62' },
  rubber: { label: 'Rubber', density: 0.0012, friction: 0.9,  restitution: 0.85, color: '#d9534f' },
  bouncy: { label: 'Bouncy', density: 0.0012, friction: 0.6,  restitution: 1.0,  color: '#3fcf8e' },
  ice:    { label: 'Ice',    density: 0.0009, friction: 0.01, restitution: 0.05, color: '#9fd6ea' },
  flesh:  { label: 'Flesh',  density: 0.0011, friction: 0.8,  restitution: 0.05, color: '#e0b48f' },
};

const mat = (p) => MATERIALS[p.material] || MATERIALS.wood;
const effFriction = (p) => clamp((p.friction ?? mat(p).friction) * PARAMS.frictionMul, 0, 2);
const effRestitution = (p) => clamp((p.restitution ?? mat(p).restitution) + PARAMS.bounceAdd, 0, 1);

/** Matter body options derived from an entity's props and the global params. */
function bodyOptions(p, extra = {}) {
  return {
    isStatic: !!p.isStatic,
    density: mat(p).density,
    friction: effFriction(p),
    restitution: effRestitution(p),
    frictionAir: PARAMS.airResistance,
    render: { fillStyle: mat(p).color },
    ...extra,
  };
}

/* =====================================================================
 * Ragdoll — builds an articulated body from parts + pivot joints.
 * Joint limits are in degrees for a character facing right; the
 * CharacterController mirrors them when it faces left.
 * ===================================================================== */
const RAGDOLL_COLORS = {
  shirts: ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'],
  pants:  ['#1f2937', '#374151', '#1e3a8a', '#3f3f46', '#57534e'],
  skins:  ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffdbac'],
};
let ragdollCounter = 0;

class Ragdoll {
  /** Height from torso centre to the soles, at scale 1. */
  static FOOT_OFFSET = 86;

  static build(p, x, y) {
    const s = p.scale || 1;
    const group = Body.nextGroup(true);    // parts of one ragdoll never collide with each other
    const flesh = p.material === 'flesh';
    const color = (c) => flesh ? c : mat(p).color;
    const back = (c) => shade(color(c), -0.28);
    const opts = (fill, extra) => bodyOptions(p, {
      collisionFilter: { group }, frictionAir: PARAMS.airResistance + 0.01, render: { fillStyle: fill }, ...extra,
    });
    const limb = (name, cy, w, h, fill) => {
      const b = Bodies.rectangle(x, y + cy * s, w * s, h * s, opts(fill, { chamfer: { radius: Math.min(w, h) * s * 0.45 } }));
      b.plugin = { part: name, extraAir: 0.01 };
      return b;
    };
    const P = {};
    // Creation order = draw order (back limbs first, front arm last).
    P.uArmL = limb('uArmL', -5, 10, 28, back(p.shirt));
    P.lArmL = limb('lArmL', 22, 9, 26, back(p.skin));
    P.uLegL = limb('uLegL', 38, 12, 32, back(p.pants));
    P.lLegL = limb('lLegL', 70, 11, 32, back(p.pants));
    P.torso = limb('torso', 0, 24, 50, color(p.shirt));
    P.uLegR = limb('uLegR', 38, 12, 32, color(p.pants));
    P.lLegR = limb('lLegR', 70, 11, 32, color(p.pants));
    P.head = Bodies.circle(x, y - 38 * s, 13 * s, opts(color(p.skin)));
    P.head.plugin = { part: 'head', extraAir: 0.01 };
    P.uArmR = limb('uArmR', -5, 10, 28, color(p.shirt));
    P.lArmR = limb('lArmR', 22, 9, 26, color(p.skin));

    const J = {};
    const joint = (name, a, b, ax, ay, bx, by, limit) => {
      const c = Constraint.create({
        bodyA: a, bodyB: b, pointA: { x: ax * s, y: ay * s }, pointB: { x: bx * s, y: by * s },
        length: 0, stiffness: PARAMS.jointStiffness, damping: PARAMS.jointDamping,
        render: { visible: false }, plugin: { joint: true },
      });
      J[name] = { c, a, b, limit: limit ? limit.map(d => d * DEG) : null };
    };
    joint('neck',      P.torso, P.head,  0, -25, 0, 13,  [-35, 35]);
    joint('shoulderL', P.torso, P.uArmL, 0, -19, 0, -14, null);
    joint('shoulderR', P.torso, P.uArmR, 0, -19, 0, -14, null);
    joint('elbowL',    P.uArmL, P.lArmL, 0, 14,  0, -13, [-150, 0]);
    joint('elbowR',    P.uArmR, P.lArmR, 0, 14,  0, -13, [-150, 0]);
    joint('hipL',      P.torso, P.uLegL, 0, 22,  0, -16, [-115, 35]);
    joint('hipR',      P.torso, P.uLegR, 0, 22,  0, -16, [-115, 35]);
    joint('kneeL',     P.uLegL, P.lLegL, 0, 16,  0, -16, [0, 150]);
    joint('kneeR',     P.uLegR, P.lLegR, 0, 16,  0, -16, [0, 150]);

    const order = ['uArmL', 'lArmL', 'uLegL', 'lLegL', 'torso', 'uLegR', 'lLegR', 'head', 'uArmR', 'lArmR'];
    return {
      bodies: order.map(k => P[k]),
      constraints: Object.values(J).map(j => j.c),
      rig: { parts: P, joints: J, scale: s, group },
    };
  }
}

/* =====================================================================
 * CharacterController — per-ragdoll behaviour driven ONLY by forces and
 * joint motors (PD torques). Nothing sets positions directly, so the
 * character stays fully vulnerable to collisions and loss of balance.
 * ===================================================================== */
const CHARACTER_STATES = {
  idle:  { label: 'Idle',  icon: '🧍' },
  walk:  { label: 'Walk',  icon: '🚶' },
  run:   { label: 'Run',   icon: '🏃' },
  jump:  { label: 'Jump',  icon: '⤴' },
  fall:  { label: 'Fall',  icon: '💤' },
  flail: { label: 'Flail', icon: '🙌' },
  sit:   { label: 'Sit',   icon: '🪑' },
};

const CHAR = {
  poseKp: 0.16, poseKd: 0.45,         // joint motor gains (per step)
  legGain: 1.5,                       // extra strength for hips and knees
  limitKp: 0.4, limitKd: 0.3,         // joint limit motor
  uprightKp: 0.15, uprightKd: 0.6,    // balance torque on the torso
  uprightInertia: 1.5,                // torso is coupled to the limbs (keep Kd*this < 2 for stability)
  supportK: 0.12, supportD: 0.9,      // leg "muscle" spring holding the hips up
  knockSpeed: 11,                     // impact speed (px/step) that knocks a ragdoll out
  loseBalance: 1.2,                   // torso tilt (rad) that makes it fall over
};

class CharacterController {
  constructor(entity, physics) {
    this.entity = entity;
    this.physics = physics;
    this.mode = 'idle';
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.t = 0;
    this.phase = 0;
    this.stun = 0;          // seconds of being knocked out (limp)
    this.recover = 1;       // 0..1 muscle strength ramp after a knock-out
    this.tiltTime = 0;
    this.stuck = 0;
    this.grounded = false;
    this.jumpPhase = 'ready';
    this.jumpT = 0;
    this.jumpReadyAt = 0;
    this.nextFlail = 0;
    this.flailPose = null;
  }

  setMode(mode) {
    if (!CHARACTER_STATES[mode]) return;
    this.mode = mode;
    this.jumpPhase = 'ready';
    if (mode !== 'fall') this.stun = 0;
  }

  /** Knock the character out for `seconds` (goes limp, then gets up). */
  knock(seconds) {
    this.stun = Math.max(this.stun, seconds);
  }

  get conscious() { return this.mode !== 'fall' && this.stun <= 0; }

  totalMass() {
    let m = 0;
    for (const b of Object.values(this.entity.rig.parts)) m += b.mass;
    return m;
  }

  /** Called once per physics step. dt = simulated seconds. */
  update(dt) {
    const rig = this.entity.rig;
    if (!rig) return;
    const { parts: P, joints: J, scale: s } = rig;
    const g = this.physics.engine.gravity;
    const gMag = Math.hypot(g.x, g.y);
    const down = gMag > 1e-4 ? { x: g.x / gMag, y: g.y / gMag } : { x: 0, y: 1 };
    const up = { x: -down.x, y: -down.y };
    const right = { x: -up.y, y: up.x };
    const uprightAngle = Math.atan2(-down.x, down.y);
    this.t += dt;

    // Joint limits apply always, even when limp, so limbs never fold unnaturally.
    for (const j of Object.values(J)) if (j.limit) this._limit(j);

    this.stun = Math.max(0, this.stun - dt);
    if (!this.conscious) { this.recover = 0; this.grounded = false; this.tiltTime = 0; return; }
    this.recover = Math.min(1, this.recover + dt * 1.2);
    const k = this.recover;
    const d = this.dir;

    const standH = (Ragdoll.FOOT_OFFSET - 2) * s;
    const h = this._probe(P.torso.position, down, 170 * s);
    // Legs can only push when a foot is actually on something; the low-torso case lets it get up.
    const footDown = this._footContact(P.lLegL, down, s) || this._footContact(P.lLegR, down, s);
    const lying = h < standH * 0.6;
    this.grounded = footDown || lying;
    const vel = P.torso.velocity;
    const vAlong = vel.x * right.x + vel.y * right.y;
    const vUp = vel.x * up.x + vel.y * up.y;

    let pose = null, supportH = standH + 2 * s, lean = 0, move = null, upright = 1, gain = 1;
    switch (this.mode) {
      case 'idle': {
        const b = Math.sin(this.t * 2);
        pose = { neck: 0, shoulderL: 6 + 3 * b, shoulderR: -6 - 3 * b, elbowL: -12, elbowR: -10,
                 hipL: -3, hipR: 3, kneeL: 2, kneeR: 2 };
        move = 0;
        break;
      }
      case 'walk': case 'run': {
        const run = this.mode === 'run';
        if (this.grounded) this.phase += dt * Math.PI * 2 * (run ? 2.4 : 1.5);
        const sp = Math.sin(this.phase), cp = Math.cos(this.phase);
        const A = run ? 42 : 26, K = run ? 80 : 40, AR = run ? 55 : 24;
        pose = { neck: run ? -8 : 0,
                 hipL: -A * sp, hipR: A * sp,
                 kneeL: 6 + K * Math.max(0, cp), kneeR: 6 + K * Math.max(0, -cp),
                 shoulderL: AR * sp, shoulderR: -AR * sp,
                 elbowL: run ? -85 : -20, elbowR: run ? -85 : -20 };
        lean = run ? 14 : 5;
        move = d * (run ? 4.4 : 1.7) * Math.sqrt(s);
        gain = run ? 1.3 : 1;
        break;
      }
      case 'jump': {
        if (this.jumpPhase === 'ready' && this.grounded && this.t > this.jumpReadyAt) {
          this.jumpPhase = 'crouch'; this.jumpT = this.t;
        }
        if (this.jumpPhase === 'crouch') {
          pose = { neck: 0, shoulderL: 35, shoulderR: 30, elbowL: -20, elbowR: -20,
                   hipL: -60, hipR: -55, kneeL: 100, kneeR: 95 };
          supportH = standH * 0.72;
          move = 0;
          if (this.t - this.jumpT > 0.22) { this._launch(up, 9 * Math.sqrt(s)); this.jumpPhase = 'air'; this.jumpT = this.t; }
        } else if (this.jumpPhase === 'air') {
          pose = { neck: -10, shoulderL: -165, shoulderR: -150, elbowL: -10, elbowR: -15,
                   hipL: -35, hipR: -25, kneeL: 55, kneeR: 45 };
          supportH = 0;
          if (this.t - this.jumpT > 0.3 && this.grounded) { this.jumpPhase = 'ready'; this.jumpReadyAt = this.t + 0.45; }
        } else {
          pose = { neck: 0, shoulderL: 5, shoulderR: -5, elbowL: -15, elbowR: -15, hipL: -3, hipR: 3, kneeL: 4, kneeR: 4 };
          move = 0;
        }
        break;
      }
      case 'flail': {
        if (this.t >= this.nextFlail || !this.flailPose) {
          this.nextFlail = this.t + rand(0.08, 0.2);
          this.flailPose = { neck: rand(-35, 35), shoulderL: rand(-180, 180), shoulderR: rand(-180, 180),
            elbowL: rand(-150, 0), elbowR: rand(-150, 0), hipL: rand(-110, 30), hipR: rand(-110, 30),
            kneeL: rand(0, 140), kneeR: rand(0, 140) };
        }
        pose = this.flailPose;
        supportH = 0; upright = 0.15; gain = 1.8;
        break;
      }
      case 'sit': {
        pose = { neck: 0, shoulderL: -25, shoulderR: -30, elbowL: -45, elbowR: -50,
                 hipL: -88, hipR: -92, kneeL: 12, kneeR: 8 };
        supportH = 0;
        break;
      }
    }

    // Joint motors toward the pose (legs carry more load, so they get stronger motors).
    if (pose) for (const name in pose) {
      const j = J[name];
      const legGain = name.startsWith('hip') || name.startsWith('knee') ? CHAR.legGain : 1;
      if (j) this._motor(j, pose[name] * DEG * d, CHAR.poseKp * gain * legGain * k, CHAR.poseKd);
    }

    // Balance: torque the torso toward "up" (relative to gravity).
    if (upright > 0) {
      const err = normAngle(uprightAngle + lean * DEG * d - P.torso.angle);
      const acc = (CHAR.uprightKp * err - CHAR.uprightKd * P.torso.angularVelocity) * upright * k;
      P.torso.torque += acc * P.torso.inertia * CHAR.uprightInertia / DTS;
    }

    const held = this.entity.grabbed;
    // Leg support: a spring force that holds the hips at standing height while feet are near ground.
    if (supportH > 0 && this.grounded && gMag > 0.01 && !held) {
      const err = (supportH - h) / s;
      const f = clamp(1 + CHAR.supportK * err - CHAR.supportD * vUp, 0, 2.6) * k;
      const F = this.totalMass() * gMag * g.scale * f;
      Body.applyForce(P.torso, P.torso.position, { x: up.x * F, y: up.y * F });
    }

    // Locomotion: force toward the target speed, only while a foot touches something.
    // Spread over all parts by mass so it accelerates the body without tipping it.
    if (move !== null && footDown && !held) {
      const a = clamp(0.4 * (move - vAlong), -0.7, 0.7) * g.scale;
      for (const part of Object.values(P)) {
        Body.applyForce(part, part.position, { x: right.x * part.mass * a, y: right.y * part.mass * a });
      }
      if (move !== 0) {
        // Turn around when blocked or at the world edge.
        if (Math.abs(vAlong) < 0.25 * Math.abs(move)) this.stuck += dt; else this.stuck = 0;
        const px = P.torso.position.x, W = this.physics.width;
        if (this.stuck > 1.2 || (px < 60 && d < 0) || (px > W - 60 && d > 0)) { this.dir = -d; this.stuck = 0; }
      }
    }

    // Losing balance: tilted too far for too long -> fall over.
    const tilt = Math.abs(normAngle(P.torso.angle - uprightAngle));
    if (this.mode !== 'flail' && !held && k >= 1 && gMag > 0.01 && tilt > CHAR.loseBalance) {
      this.tiltTime += dt;
      if (this.tiltTime > 0.4) { this.knock(1.6); this.tiltTime = 0; }
    } else this.tiltTime = 0;
  }

  /** PD torque pair that drives the relative angle of joint j toward target. */
  _motor(j, target, kp, kd) {
    const rel = normAngle(j.b.angle - j.a.angle);
    const err = normAngle(target - rel);
    const relVel = j.b.angularVelocity - j.a.angularVelocity;
    this._torquePair(j.a, j.b, kp * err - kd * relVel);
  }

  _limit(j) {
    let [lo, hi] = j.limit;
    if (this.dir < 0) [lo, hi] = [-hi, -lo];
    const rel = normAngle(j.b.angle - j.a.angle);
    let err;
    if (rel < lo) err = lo - rel; else if (rel > hi) err = hi - rel; else return;
    const relVel = j.b.angularVelocity - j.a.angularVelocity;
    this._torquePair(j.a, j.b, CHAR.limitKp * err - CHAR.limitKd * relVel);
  }

  /** Equal and opposite torques giving relative angular acceleration `acc` (rad/step²). */
  _torquePair(a, b, acc) {
    const I = 1 / (1 / a.inertia + 1 / b.inertia);
    const tau = acc * I / DTS;
    b.torque += tau;
    a.torque -= tau;
  }

  /** Jump impulse: add the same upward velocity to every part. */
  _launch(up, v) {
    for (const b of Object.values(this.entity.rig.parts)) {
      const cur = Body.getVelocity(b);
      Body.setVelocity(b, { x: cur.x + up.x * v, y: cur.y + up.y * v });
    }
  }

  /** True if the sole of this lower leg is within a few px of a surface. */
  _footContact(leg, down, s) {
    const tip = { x: leg.position.x - Math.sin(leg.angle) * 16 * s, y: leg.position.y + Math.cos(leg.angle) * 16 * s };
    return this._probe(tip, down, 14 * s) < 9 * s;
  }

  /** Distance along `dir` from `origin` to the first solid body that is not part of this ragdoll. */
  _probe(origin, dir, maxLen) {
    const group = this.entity.rig.group;
    const ex = origin.x + dir.x * maxLen, ey = origin.y + dir.y * maxLen;
    const minX = Math.min(origin.x, ex) - 1, maxX = Math.max(origin.x, ex) + 1;
    const minY = Math.min(origin.y, ey) - 1, maxY = Math.max(origin.y, ey) + 1;
    const cands = [];
    for (const b of this.physics.stepBodies) {
      if (b.isSensor || b.collisionFilter.group === group) continue;
      if (b.bounds.max.x < minX || b.bounds.min.x > maxX || b.bounds.max.y < minY || b.bounds.min.y > maxY) continue;
      cands.push(b);
    }
    if (!cands.length) return Infinity;
    const p = { x: 0, y: 0 };
    for (let t = 0; t <= maxLen; t += 4) {
      p.x = origin.x + dir.x * t; p.y = origin.y + dir.y * t;
      for (const b of cands) if (bodyContains(b, p)) return t;
    }
    return Infinity;
  }
}

/* =====================================================================
 * OBJECT_DEFS — reusable spawnable object definitions.
 *  defaults : initial props (material, size, isStatic, ...)
 *  size     : prop keys the inspector shows as size sliders
 *  toggles  : extra boolean props shown in the inspector
 *  prepare  : optional hook to fill in per-instance props
 *  create(props, x, y, angle) -> { bodies, constraints?, rig? }
 * Add an entry to make a new spawnable object; the UI is generated.
 * ===================================================================== */
const OBJECT_DEFS = {
  crate: {
    label: 'Crate', icon: '📦', size: ['w', 'h'],
    defaults: { material: 'wood', w: 50, h: 50, isStatic: false },
    create: (p, x, y, a) => ({ bodies: [Bodies.rectangle(x, y, p.w, p.h,
      bodyOptions(p, { angle: a, plugin: { decor: 'crate' } }))] }),
  },
  metalBlock: {
    label: 'Metal block', icon: '🔩', size: ['w', 'h'],
    defaults: { material: 'metal', w: 70, h: 40, isStatic: false },
    create: (p, x, y, a) => ({ bodies: [Bodies.rectangle(x, y, p.w, p.h,
      bodyOptions(p, { angle: a, plugin: { decor: 'rivets' } }))] }),
  },
  ball: {
    label: 'Heavy ball', icon: '⚫', size: ['r'],
    defaults: { material: 'metal', r: 28, isStatic: false },
    create: (p, x, y, a) => ({ bodies: [Bodies.circle(x, y, p.r, bodyOptions(p, { angle: a }))] }),
  },
  rubberBall: {
    label: 'Rubber ball', icon: '🔴', size: ['r'],
    defaults: { material: 'rubber', r: 20, isStatic: false },
    create: (p, x, y, a) => ({ bodies: [Bodies.circle(x, y, p.r, bodyOptions(p, { angle: a }))] }),
  },
  wall: {
    label: 'Wall', icon: '🧱', size: ['w', 'h'],
    defaults: { material: 'stone', w: 30, h: 200, isStatic: true },
    create: (p, x, y, a) => ({ bodies: [Bodies.rectangle(x, y, p.w, p.h,
      bodyOptions(p, { angle: a, plugin: { decor: 'bricks' } }))] }),
  },
  movableWall: {
    label: 'Movable wall', icon: '🚪', size: ['w', 'h'],
    defaults: { material: 'stone', w: 24, h: 160, isStatic: false },
    create: (p, x, y, a) => ({ bodies: [Bodies.rectangle(x, y, p.w, p.h,
      bodyOptions(p, { angle: a, plugin: { decor: 'bricks' } }))] }),
  },
  platform: {
    label: 'Platform', icon: '▬', size: ['w', 'h'],
    defaults: { material: 'wood', w: 220, h: 18, isStatic: true },
    create: (p, x, y, a) => ({ bodies: [Bodies.rectangle(x, y, p.w, p.h, bodyOptions(p, { angle: a }))] }),
  },
  bouncyPlatform: {
    label: 'Bouncy pad', icon: '🟩', size: ['w', 'h'],
    defaults: { material: 'bouncy', w: 160, h: 16, isStatic: true },
    create: (p, x, y, a) => ({ bodies: [Bodies.rectangle(x, y, p.w, p.h,
      bodyOptions(p, { angle: a, plugin: { decor: 'stripes' } }))] }),
  },
  ramp: {
    label: 'Ramp', icon: '◢', size: ['w', 'h'], toggles: [{ key: 'flip', label: 'Mirror (high side left)' }],
    defaults: { material: 'stone', w: 240, h: 100, isStatic: true, flip: false },
    create: (p, x, y, a) => {
      const verts = p.flip
        ? [{ x: 0, y: 0 }, { x: p.w, y: 0 }, { x: 0, y: -p.h }]
        : [{ x: 0, y: 0 }, { x: p.w, y: 0 }, { x: p.w, y: -p.h }];
      const body = Bodies.fromVertices(x, y, [verts], bodyOptions(p));
      Body.setAngle(body, a);
      return { bodies: [body] };
    },
  },
  bridge: {
    label: 'Bridge', icon: '🌉', size: ['w'], anchored: true,
    defaults: { material: 'wood', w: 300, isStatic: false, plankW: 26, plankH: 10 },
    // A chain of planks pinned to two world anchors.
    create: (p, x, y) => {
      const n = Math.max(3, Math.round(p.w / p.plankW));
      const pw = p.w / n;
      const group = Body.nextGroup(true);
      const bodies = [], constraints = [];
      for (let i = 0; i < n; i++) {
        bodies.push(Bodies.rectangle(x - p.w / 2 + pw * (i + 0.5), y, pw, p.plankH,
          bodyOptions(p, { collisionFilter: { group }, plugin: { decor: 'plank' } })));
      }
      const link = (o) => Constraint.create({ stiffness: PARAMS.jointStiffness, damping: PARAMS.jointDamping,
        length: 0, render: { visible: false }, plugin: { joint: true }, ...o });
      for (let i = 0; i < n - 1; i++) {
        constraints.push(link({ bodyA: bodies[i], pointA: { x: pw / 2, y: 0 },
                                bodyB: bodies[i + 1], pointB: { x: -pw / 2, y: 0 } }));
      }
      constraints.push(link({ pointA: { x: x - p.w / 2, y }, bodyB: bodies[0], pointB: { x: -pw / 2, y: 0 },
        render: { visible: true, anchor: true } }));
      constraints.push(link({ pointA: { x: x + p.w / 2, y }, bodyB: bodies[n - 1], pointB: { x: pw / 2, y: 0 },
        render: { visible: true, anchor: true } }));
      return { bodies, constraints };
    },
  },
  ragdoll: {
    label: 'Ragdoll', icon: '🧍', size: ['scale'], character: true, noStatic: true,
    defaults: { material: 'flesh', scale: 1, isStatic: false },
    prepare: (p) => {
      p.shirt ??= pick(RAGDOLL_COLORS.shirts);
      p.pants ??= pick(RAGDOLL_COLORS.pants);
      p.skin ??= pick(RAGDOLL_COLORS.skins);
    },
    create: (p, x, y) => Ragdoll.build(p, x, y),
  },
};

/* =====================================================================
 * ObjectManager — spawns, tracks, edits and removes entities.
 * An entity = one spawned thing (possibly several bodies), stored as a
 * Matter Composite. Every body links back via body.plugin.entity.
 * ===================================================================== */
class ObjectManager {
  constructor(physics) {
    this.physics = physics;
    this.entities = new Map();
    this._nextId = 1;
    this.onChange = null;   // entity added / removed
    this.onRebuild = null;  // entity bodies replaced
  }

  spawn(type, x, y, overrides = {}) {
    const def = OBJECT_DEFS[type];
    if (!def) throw new Error('Unknown object type: ' + type);
    const props = { ...def.defaults, ...overrides };
    delete props.angle;
    if (def.prepare) def.prepare(props);
    const entity = {
      id: this._nextId++, type, def, props,
      name: def.character ? 'Dummy ' + (++ragdollCounter) : def.label,
      origin: { x, y },
      composite: Composite.create({ label: type }),
      rig: null, controller: null, grabbed: false,
    };
    this._populate(entity, x, y, overrides.angle || 0);
    if (def.character) entity.controller = new CharacterController(entity, this.physics);
    this.entities.set(entity.id, entity);
    this.physics.add(entity.composite);
    if (this.onChange) this.onChange();
    return entity;
  }

  _populate(entity, x, y, angle) {
    const res = entity.def.create(entity.props, x, y, angle);
    const constraints = res.constraints || [];
    entity.rig = res.rig || null;
    const area = res.bodies.reduce((s, b) => s + b.area, 0);
    for (const b of res.bodies) {
      b.plugin = { ...b.plugin, entity };
      if (entity.props.mass && !b.isStatic) Body.setMass(b, entity.props.mass * b.area / area);
    }
    Composite.add(entity.composite, [...res.bodies, ...constraints]);
  }

  entityOf(body) { return (body && body.plugin && body.plugin.entity) || null; }
  bodiesOf(entity) { return Composite.allBodies(entity.composite); }
  characters() { return [...this.entities.values()].filter(e => e.controller); }

  remove(entity) {
    if (!entity || !this.entities.has(entity.id)) return;
    this.physics.remove(entity.composite);
    this.entities.delete(entity.id);
    if (this.onChange) this.onChange();
  }

  clear() {
    for (const e of this.entities.values()) this.physics.remove(e.composite);
    this.entities.clear();
    if (this.onChange) this.onChange();
  }

  massOf(entity) {
    return this.bodiesOf(entity).reduce((s, b) => s + (b.isStatic ? 0 : b.mass), 0);
  }

  /** Re-apply friction / bounciness after the global multipliers changed. */
  refreshSurfaces() {
    for (const e of this.entities.values()) {
      for (const b of this.bodiesOf(e)) { b.friction = effFriction(e.props); b.restitution = effRestitution(e.props); }
    }
  }

  /**
   * Apply property changes live. Friction / bounciness / mass are set on the
   * existing bodies; size, static, material and toggles rebuild the bodies in
   * place, keeping position, angle and velocity.
   */
  update(entity, changes) {
    changes = { ...changes };
    if (changes.material && changes.material !== entity.props.material) {
      changes.friction = undefined;      // a new material brings its own values
      changes.restitution = undefined;
      changes.mass = undefined;
    }
    const rebuildKeys = ['w', 'h', 'r', 'scale', 'isStatic', 'material', ...(entity.def.toggles || []).map(t => t.key)];
    const rebuild = rebuildKeys.some(k => k in changes && changes[k] !== entity.props[k]);
    Object.assign(entity.props, changes);
    for (const k of Object.keys(entity.props)) if (entity.props[k] === undefined) delete entity.props[k];

    if (rebuild) { this.rebuild(entity); return; }
    const bodies = this.bodiesOf(entity);
    const area = bodies.reduce((s, b) => s + b.area, 0);
    for (const b of bodies) {
      b.friction = effFriction(entity.props);
      b.restitution = effRestitution(entity.props);
      if (!b.isStatic && 'mass' in changes) {
        if (entity.props.mass) Body.setMass(b, entity.props.mass * b.area / area);
        else Body.setDensity(b, mat(entity.props).density);
      }
    }
  }

  /** Recreate an entity's bodies (optionally at a new position). */
  rebuild(entity, at = null) {
    const old = this.bodiesOf(entity);
    if (entity.def.anchored) {
      Composite.clear(entity.composite, false, true);
      this._populate(entity, entity.origin.x, entity.origin.y, 0);
    } else {
      const ref = entity.rig ? entity.rig.parts.torso : old[0];
      const ok = ref && Number.isFinite(ref.position.x) && Number.isFinite(ref.position.y);
      const pos = at || (ok ? { x: ref.position.x, y: ref.position.y } : { x: this.physics.width / 2, y: 100 });
      const angle = entity.rig || !ok ? 0 : ref.angle;
      const vel = ok && !at ? Body.getVelocity(ref) : { x: 0, y: 0 };
      const angVel = ok && !at && !entity.rig ? Body.getAngularVelocity(ref) : 0;
      Composite.clear(entity.composite, false, true);
      this._populate(entity, pos.x, pos.y, angle);
      for (const b of this.bodiesOf(entity)) {
        if (b.isStatic) continue;
        Body.setVelocity(b, vel);
        Body.setAngularVelocity(b, angVel);
      }
    }
    if (this.onRebuild) this.onRebuild(entity);
  }
}

/* =====================================================================
 * PhysicsManager — engine, fixed-step loop, boundaries, params, recovery
 * ===================================================================== */
class PhysicsManager {
  constructor() {
    this.engine = Engine.create({ positionIterations: 10, velocityIterations: 8, constraintIterations: 4 });
    this.world = this.engine.world;
    this.width = 800;
    this.height = 600;
    this.boundaries = [];
    this.paused = false;
    this._acc = 0;
    this.stepBodies = [];            // all bodies, refreshed at the start of each step
    this.onBeforeStep = [];          // callbacks run before each physics step
    this.onEscape = null;            // (body) => true if handled
    this.onSurfaceParamsChanged = null;
    Events.on(this.engine, 'beforeUpdate', () => {
      this.stepBodies = Composite.allBodies(this.world);
      this._clampVelocities();
      for (const fn of this.onBeforeStep) fn();
    });
    Events.on(this.engine, 'afterUpdate', () => this._recoverEscapedBodies());
    this.applyAllParams();
  }

  get groundTop() { return this.height - CONFIG.GROUND_H; }
  /** Simulated seconds per physics step (respects time scale). */
  get stepSeconds() { return CONFIG.STEP_MS / 1000 * PARAMS.timeScale; }

  setParam(key, value) { PARAMS[key] = value; this._applyParam(key); }
  applyAllParams() { for (const k of Object.keys(PARAMS)) this._applyParam(k); }

  _applyParam(key) {
    switch (key) {
      case 'gravity': case 'gravityDir': {
        const a = PARAMS.gravityDir * DEG;
        this.engine.gravity.x = Math.sin(a) * PARAMS.gravity;
        this.engine.gravity.y = Math.cos(a) * PARAMS.gravity;
        break;
      }
      case 'timeScale':
        this.engine.timing.timeScale = PARAMS.timeScale;
        break;
      case 'airResistance':
        for (const b of this.dynamicBodies()) b.frictionAir = PARAMS.airResistance + ((b.plugin && b.plugin.extraAir) || 0);
        break;
      case 'frictionMul': case 'bounceAdd':
        if (this.onSurfaceParamsChanged) this.onSurfaceParamsChanged();
        break;
      case 'jointStiffness': case 'jointDamping':
        for (const c of Composite.allConstraints(this.world)) {
          if (c.plugin && c.plugin.joint) { c.stiffness = PARAMS.jointStiffness; c.damping = PARAMS.jointDamping; }
        }
        break;
    }
  }

  resize(width, height) {
    // Keep the scene standing on the ground: shift everything by the change in ground height.
    const dy = this.boundaries.length ? height - this.height : 0;
    this.width = width;
    this.height = height;
    this._buildBoundaries();
    if (dy) this._shiftWorld(dy);
    this._keepBodiesInside();
  }

  _shiftWorld(dy) {
    for (const b of Composite.allBodies(this.world)) {
      if (!(b.plugin && b.plugin.boundary)) Body.translate(b, { x: 0, y: dy });
    }
    for (const c of Composite.allConstraints(this.world)) {
      if (c.plugin && c.plugin.grab) continue;
      if (!c.bodyA) c.pointA.y += dy;   // world anchors (e.g. bridge ends)
      if (!c.bodyB) c.pointB.y += dy;
    }
    if (this.onWorldShift) this.onWorldShift(dy);
  }

  _buildBoundaries() {
    if (this.boundaries.length) Composite.remove(this.world, this.boundaries);
    const { WALL_T: T, GROUND_H: G } = CONFIG;
    const w = this.width, h = this.height;
    const opts = (label) => ({ isStatic: true, label, friction: 0.8, restitution: 0.1, plugin: { boundary: true } });
    this.boundaries = [
      Bodies.rectangle(w / 2, h - G + T / 2, w + T * 2, T, opts('ground')),
      Bodies.rectangle(-T / 2, h / 2, T, h * 3, opts('wall-left')),
      Bodies.rectangle(w + T / 2, h / 2, T, h * 3, opts('wall-right')),
      Bodies.rectangle(w / 2, -T / 2, w + T * 2, T, opts('ceiling')),
    ];
    Composite.add(this.world, this.boundaries);
  }

  /** After a resize, push bodies back inside the new boundaries. */
  _keepBodiesInside() {
    for (const b of Composite.allBodies(this.world)) {
      if (b.plugin && b.plugin.boundary) continue;
      const hw = (b.bounds.max.x - b.bounds.min.x) / 2;
      const hh = (b.bounds.max.y - b.bounds.min.y) / 2;
      const x = clamp(b.position.x, hw + 1, Math.max(hw + 1, this.width - hw - 1));
      const y = clamp(b.position.y, hh + 1, Math.max(hh + 1, this.groundTop - hh - 1));
      if (x !== b.position.x || y !== b.position.y) {
        Body.setPosition(b, { x, y });
        if (!b.isStatic) Body.setVelocity(b, { x: 0, y: 0 });
      }
    }
  }

  _clampVelocities() {
    for (const b of this.stepBodies) {
      if (b.isStatic) continue;
      if (b.speed > CONFIG.MAX_SPEED) {
        const v = Body.getVelocity(b), f = CONFIG.MAX_SPEED / b.speed;
        Body.setVelocity(b, { x: v.x * f, y: v.y * f });
      }
      if (Math.abs(b.angularVelocity) > CONFIG.MAX_ANG_SPEED) {
        Body.setAngularVelocity(b, Body.getAngularVelocity(b) * CONFIG.MAX_ANG_SPEED / Math.abs(b.angularVelocity));
      }
    }
  }

  _recoverEscapedBodies() {
    const m = CONFIG.ESCAPE_MARGIN;
    for (const b of this.dynamicBodies()) {
      const { x, y } = b.position;
      const broken = !Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(b.angle);
      const outside = x < -m || x > this.width + m || y < -m || y > this.height + m;
      if (!broken && !outside) continue;
      if (this.onEscape && this.onEscape(b, broken)) continue;
      // Return it to the top centre at rest instead of letting it vanish.
      Body.setPosition(b, { x: this.width / 2, y: 60 });
      Body.setVelocity(b, { x: 0, y: 0 });
      Body.setAngularVelocity(b, 0);
      if (!Number.isFinite(b.angle)) Body.setAngle(b, 0);
    }
  }

  dynamicBodies() { return Composite.allBodies(this.world).filter(b => !b.isStatic); }
  allBodies() { return Composite.allBodies(this.world); }
  add(items) { Composite.add(this.world, items); }
  remove(items) { Composite.remove(this.world, items, true); }

  /** Remove everything except the boundaries. */
  clear() {
    Composite.clear(this.world, false, true);
    Composite.add(this.world, this.boundaries);
    this._acc = 0;
  }

  step() { Engine.update(this.engine, CONFIG.STEP_MS); }

  /** Advance the simulation by real elapsed time using fixed steps. */
  advance(dtMs) {
    if (this.paused) { this._acc = 0; return; }
    this._acc += dtMs;
    let n = 0;
    while (this._acc >= CONFIG.STEP_MS && n < CONFIG.MAX_STEPS_PER_FRAME) {
      this.step();
      this._acc -= CONFIG.STEP_MS;
      n++;
    }
    if (n === CONFIG.MAX_STEPS_PER_FRAME) this._acc = 0;
  }
}

/* =====================================================================
 * PresetManager — applies physics presets and runs their tick effects
 * ===================================================================== */
class PresetManager {
  constructor(app) {
    this.app = app;
    this.active = 'realistic';
    this.t = 0;
    this.nextEvent = 3;
  }

  apply(name) {
    const preset = PHYSICS_PRESETS[name];
    if (!preset) return;
    Object.assign(PARAMS, DEFAULT_PARAMS, preset.params);
    this.app.physics.applyAllParams();
    this.active = name;
    this.t = 0;
    this.nextEvent = 3;
    this.app.ui.syncParams();
  }

  /** A slider was moved by hand: the preset no longer describes the state. */
  markCustom() {
    this.active = 'custom';
    this.app.ui.syncPresetSelect();
  }

  tick(dt) {
    const p = PHYSICS_PRESETS[this.active];
    if (p && p.tick) p.tick(this, dt);
  }
}

/* =====================================================================
 * ToolManager — active tool, spawn placement, explosions, wind
 * ===================================================================== */
const TOOLS = {
  grab:    { label: 'Grab',    icon: '✋', key: '1',
             hint: 'Drag to move · release while moving to throw · click to select · Q/E or wheel rotates static objects' },
  delete:  { label: 'Delete',  icon: '✖', key: '2', hint: 'Click an object or ragdoll to delete it' },
  explode: { label: 'Explode', icon: '💥', key: '3', hint: 'Click to detonate · set radius and strength under Environment' },
};

class ToolManager {
  constructor(app) {
    this.app = app;
    this.tool = 'grab';
    this.spawnType = null;
    this.ghost = null;
    this.explosion = { radius: 160, strength: 60 };
    this.wind = { strength: 0, last: 50, gusts: true };
    this.effects = [];
    this.windT = 0;
    this.windNow = 0;     // current wind incl. gusts (for rendering)
  }

  setTool(name) {
    if (!TOOLS[name]) return;
    this.tool = name;
    this.cancelSpawn();
    this.app.ui.syncTools();
  }

  startSpawn(type) {
    const def = OBJECT_DEFS[type];
    const props = { ...def.defaults };
    if (def.prepare) def.prepare(props);
    const res = def.create(props, 0, 0, 0);
    const at = this.app.interaction.mouse.inside ? { ...this.app.interaction.mouse } : { x: -9999, y: -9999 };
    this.ghost = { type, props, bodies: res.bodies, constraints: res.constraints || [], at: { x: 0, y: 0 } };
    this.moveGhost(at);
    this.spawnType = type;
    this.app.ui.syncTools();
  }

  moveGhost(p) {
    const g = this.ghost;
    if (!g) return;
    const d = { x: p.x - g.at.x, y: p.y - g.at.y };
    for (const b of g.bodies) Body.translate(b, d);
    for (const c of g.constraints) if (!c.bodyA) { c.pointA.x += d.x; c.pointA.y += d.y; }
    g.at = { x: p.x, y: p.y };
  }

  /** Place the current spawn type at p; the ghost is re-rolled for the next one. */
  placeSpawn(p) {
    if (!this.spawnType) return null;
    const type = this.spawnType;
    let { x, y } = p;
    if (OBJECT_DEFS[type].character) {
      // Keep the feet above the ground when clicking low.
      y = Math.min(y, this.app.physics.groundTop - Ragdoll.FOOT_OFFSET - 2);
    }
    // Reuse the ghost's props so the placed object matches the preview (e.g. ragdoll colours).
    const ent = this.app.objects.spawn(type, x, y, { ...this.ghost.props });
    this.startSpawn(type);
    this.moveGhost(p);
    return ent;
  }

  cancelSpawn() {
    this.spawnType = null;
    this.ghost = null;
    this.app.ui.syncTools();
  }

  /** Radial impulse with linear falloff. Heavier bodies move less (Δv = J / m). */
  explode(p, strength = this.explosion.strength, radius = this.explosion.radius) {
    for (const b of this.app.physics.dynamicBodies()) {
      const dx = b.position.x - p.x, dy = b.position.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist > radius) continue;
      const fall = 1 - dist / radius;
      const n = dist > 1e-3 ? { x: dx / dist, y: dy / dist } : { x: 0, y: -1 };
      const dv = Math.min(strength * 0.5 * fall / b.mass, 35);
      const v = Body.getVelocity(b);
      Body.setVelocity(b, { x: v.x + n.x * dv, y: v.y + n.y * dv });
      Body.setAngularVelocity(b, Body.getAngularVelocity(b) + rand(-0.15, 0.15) * fall);
      const ent = this.app.objects.entityOf(b);
      if (ent && ent.controller && fall > 0.1) ent.controller.knock(1 + 3 * fall);
    }
    this.effects.push({ kind: 'explosion', x: p.x, y: p.y, r: radius, t: 0, life: 0.55 });
  }

  toggleWind() {
    if (this.wind.strength) { this.wind.last = this.wind.strength; this.wind.strength = 0; }
    else this.wind.strength = this.wind.last || 50;
    this.app.ui.syncEnv();
  }

  /** Wind: horizontal force proportional to area (light, large things move most). */
  applyWind(dt) {
    this.windT += dt;
    let s = this.wind.strength;
    if (s && this.wind.gusts) {
      const t = this.windT;
      s *= 0.7 + 0.3 * Math.sin(t * 1.3) + 0.2 * Math.sin(t * 3.7 + 1) + 0.1 * Math.sin(t * 7.1);
    }
    this.windNow = s;
    if (!s) return;
    const k = s * 5e-9;
    for (const b of this.app.physics.stepBodies) {
      if (b.isStatic) continue;
      Body.applyForce(b, b.position, { x: k * b.area, y: 0 });
    }
  }

  updateEffects(dt) {
    for (const e of this.effects) e.t += dt;
    this.effects = this.effects.filter(e => e.t < e.life);
  }
}

/* =====================================================================
 * InteractionManager — pointer input: grab/drag/throw, select, delete,
 * explode, spawn placement, rotating static objects.
 * ===================================================================== */
class InteractionManager {
  constructor(app) {
    this.app = app;
    this.canvas = app.canvas;
    this.mouse = { x: 0, y: 0, inside: false };
    this.grab = null;        // { constraint, entity }
    this.dragStatic = null;  // { entity, body, offset }
    this.samples = [];       // recent pointer positions, for throw velocity
    const c = this.canvas;
    c.addEventListener('pointerdown', (e) => this._down(e));
    c.addEventListener('pointermove', (e) => this._move(e));
    c.addEventListener('pointerup', (e) => this._up(e));
    c.addEventListener('pointercancel', (e) => this._up(e));
    c.addEventListener('pointerleave', () => { this.mouse.inside = false; this.app.renderer.hovered = null; });
    c.addEventListener('pointerenter', () => { this.mouse.inside = true; });
    c.addEventListener('contextmenu', (e) => e.preventDefault());
    c.addEventListener('wheel', (e) => {
      if (this.rotateSelected(Math.sign(e.deltaY) * 5 * DEG)) e.preventDefault();
    }, { passive: false });
  }

  _pos(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  bodyAt(p) {
    const bodies = this.app.physics.allBodies().filter(b => !(b.plugin && b.plugin.boundary));
    const hits = Query.point(bodies, p);
    if (!hits.length) return null;
    // Prefer dynamic bodies over static ones when they overlap.
    const dyn = hits.filter(b => !b.isStatic);
    return (dyn.length ? dyn : hits)[(dyn.length ? dyn : hits).length - 1];
  }

  _down(e) {
    const p = this._pos(e);
    this.mouse = { ...p, inside: true };
    const app = this.app, tools = app.tools;
    if (e.button === 2) { tools.cancelSpawn(); return; }
    if (e.button !== 0) return;
    this.canvas.setPointerCapture(e.pointerId);

    if (tools.spawnType) { app.select(tools.placeSpawn(p)); return; }

    const body = this.bodyAt(p);
    const entity = app.objects.entityOf(body);
    if (tools.tool === 'delete') { if (entity) app.removeEntity(entity); return; }
    if (tools.tool === 'explode') { tools.explode(p); return; }

    // Grab tool
    app.select(entity);
    if (!body || !entity) return;
    if (!body.isStatic) {
      const constraint = Constraint.create({
        pointA: { ...p }, bodyB: body,
        pointB: { x: p.x - body.position.x, y: p.y - body.position.y },
        length: 0, stiffness: 0.2, damping: 0.08,
        render: { strokeStyle: 'rgba(79,157,255,.8)', lineWidth: 1.5 }, plugin: { grab: true },
      });
      app.physics.add(constraint);
      this.grab = { constraint, entity };
      entity.grabbed = true;
    } else if (app.objects.bodiesOf(entity).length === 1) {
      // Static objects are building pieces: drag them into place.
      this.dragStatic = { entity, body, offset: { x: body.position.x - p.x, y: body.position.y - p.y } };
    }
    this.canvas.classList.add('dragging');
  }

  _move(e) {
    const p = this._pos(e);
    this.mouse = { ...p, inside: true };
    const now = performance.now();
    this.samples.push({ t: now, x: p.x, y: p.y });
    while (this.samples.length && now - this.samples[0].t > 100) this.samples.shift();
    const app = this.app;
    if (app.tools.ghost) app.tools.moveGhost(p);
    if (this.grab) { this.grab.constraint.pointA.x = p.x; this.grab.constraint.pointA.y = p.y; }
    if (this.dragStatic) {
      const { body, offset } = this.dragStatic;
      Body.setPosition(body, { x: p.x + offset.x, y: Math.min(p.y + offset.y, app.physics.groundTop + 10) });
    }
    app.renderer.hovered = (this.grab || this.dragStatic || app.tools.ghost) ? null : app.objects.entityOf(this.bodyAt(p));
  }

  _up() {
    this.release();
  }

  /** Let go of whatever is held; the body keeps its velocity (= a throw). */
  release() {
    if (this.grab) {
      this._throw();
      this.app.physics.remove(this.grab.constraint);
      this.grab.entity.grabbed = false;
      this.grab = null;
    }
    this.dragStatic = null;
    this.canvas.classList.remove('dragging');
  }

  /**
   * If the pointer was moving faster than the held body when released, add the
   * difference as an impulse. This keeps throws reliable when pointer events
   * arrive less often than physics steps (the spring alone would lose speed).
   */
  _throw() {
    const s = this.samples, now = performance.now();
    if (s.length < 2 || now - s[s.length - 1].t > 60) return;
    const a = s[0], b = s[s.length - 1], dt = b.t - a.t;
    if (dt < 8) return;
    const k = CONFIG.STEP_MS / dt * 0.85;
    let v = { x: (b.x - a.x) * k, y: (b.y - a.y) * k };
    const sp = Math.hypot(v.x, v.y), max = CONFIG.MAX_SPEED * 0.7;
    if (sp > max) v = { x: v.x * max / sp, y: v.y * max / sp };
    const held = this.grab.constraint.bodyB, vb = Body.getVelocity(held);
    if (Math.hypot(v.x, v.y) <= Math.hypot(vb.x, vb.y)) return;
    const dv = { x: v.x - vb.x, y: v.y - vb.y };
    for (const body of this.app.objects.bodiesOf(this.grab.entity)) {
      const cur = Body.getVelocity(body);
      Body.setVelocity(body, { x: cur.x + dv.x, y: cur.y + dv.y });
    }
  }

  releaseIfEntity(entity) {
    if ((this.grab && this.grab.entity === entity) || (this.dragStatic && this.dragStatic.entity === entity)) this.release();
  }

  /** Rotate the selected static single-body object. Returns true if it did. */
  rotateSelected(delta) {
    const e = this.app.selected;
    if (!e) return false;
    const bodies = this.app.objects.bodiesOf(e);
    if (bodies.length !== 1 || !bodies[0].isStatic) return false;
    Body.setAngle(bodies[0], bodies[0].angle + delta);
    return true;
  }
}

/* =====================================================================
 * Renderer — Canvas 2D drawing of the world, effects and overlays
 * ===================================================================== */
class Renderer {
  constructor(app) {
    this.app = app;
    this.canvas = app.canvas;
    this.ctx = this.canvas.getContext('2d');
    this.physics = app.physics;
    this.selected = null;   // entity
    this.hovered = null;    // entity
    this.dpr = 1;
    this.windParticles = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), l: rand(0.5, 1) }));
  }

  resize(width, height) {
    this.dpr = window.devicePixelRatio || 1;
    this.canvas.width = Math.round(width * this.dpr);
    this.canvas.height = Math.round(height * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  }

  render(dt) {
    const { ctx, physics, app } = this;
    const w = physics.width, h = physics.height;
    ctx.fillStyle = '#12151b';
    ctx.fillRect(0, 0, w, h);
    this._drawGrid(w, h);
    this._drawGravityArrow();

    for (const b of Composite.allBodies(physics.world)) {
      if (b.plugin && b.plugin.boundary) continue;
      this._drawBody(b);
    }
    for (const c of Composite.allConstraints(physics.world)) this._drawConstraint(c);
    this._drawGround(w, h);

    if (this.hovered && this.hovered !== this.selected) this._outline(this.hovered, 'rgba(255,255,255,.35)', 1.5);
    if (this.selected) this._outline(this.selected, '#4f9dff', 2.5);

    const tools = app.tools;
    if (tools.ghost && app.interaction.mouse.inside) {
      ctx.globalAlpha = 0.45;
      for (const b of tools.ghost.bodies) this._drawBody(b);
      ctx.globalAlpha = 1;
    }
    if (tools.tool === 'explode' && !tools.ghost && app.interaction.mouse.inside) {
      const m = app.interaction.mouse;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.arc(m.x, m.y, tools.explosion.radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,140,60,.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);
    }
    this._drawWind(dt, w, h);
    this._drawEffects();
  }

  _drawGrid(w, h) {
    const ctx = this.ctx, s = 50;
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= w; x += s) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, h); }
    for (let y = 0; y <= h; y += s) { ctx.moveTo(0, y + .5); ctx.lineTo(w, y + .5); }
    ctx.stroke();
  }

  /** Small indicator of gravity direction / strength in the corner. */
  _drawGravityArrow() {
    const ctx = this.ctx, g = this.physics.engine.gravity;
    const mag = Math.hypot(g.x, g.y);
    const cx = 34, cy = 34;
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (mag < 1e-3) { ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '10px system-ui'; ctx.textAlign = 'center'; ctx.fillText('0 g', cx, cy + 3); return; }
    const len = 6 + Math.min(mag, 3) * 4.5, ux = g.x / mag, uy = g.y / mag;
    ctx.beginPath();
    ctx.moveTo(cx - ux * len, cy - uy * len);
    ctx.lineTo(cx + ux * len, cy + uy * len);
    ctx.lineTo(cx + ux * len - (ux * 5 - uy * 4), cy + uy * len - (uy * 5 + ux * 4));
    ctx.moveTo(cx + ux * len, cy + uy * len);
    ctx.lineTo(cx + ux * len - (ux * 5 + uy * 4), cy + uy * len - (uy * 5 - ux * 4));
    ctx.strokeStyle = 'rgba(255,255,255,.45)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  _drawGround(w, h) {
    const ctx = this.ctx, top = this.physics.groundTop;
    ctx.fillStyle = '#23262e';
    ctx.fillRect(0, top, w, h - top);
    ctx.fillStyle = '#3a3f4b';
    ctx.fillRect(0, top, w, 3);
  }

  _partPath(part) {
    const ctx = this.ctx;
    ctx.beginPath();
    if (part.circleRadius) {
      ctx.arc(part.position.x, part.position.y, part.circleRadius, 0, Math.PI * 2);
    } else {
      const v = part.vertices;
      ctx.moveTo(v[0].x, v[0].y);
      for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
      ctx.closePath();
    }
  }

  _drawBody(body) {
    const ctx = this.ctx;
    const fill = body.render.fillStyle || '#888';
    const plugin = body.plugin || {};
    for (const p of bodyParts(body)) {
      this._partPath(p);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(0,0,0,.4)';
      ctx.stroke();
      if (p.circleRadius && !plugin.part) {
        // Spoke shows rotation of round bodies.
        ctx.beginPath();
        ctx.moveTo(p.position.x, p.position.y);
        ctx.lineTo(p.position.x + Math.cos(body.angle) * p.circleRadius, p.position.y + Math.sin(body.angle) * p.circleRadius);
        ctx.strokeStyle = 'rgba(255,255,255,.3)';
        ctx.stroke();
      }
      if (plugin.decor && p.vertices.length === 4) this._decor(plugin.decor, p);
    }
    if (plugin.part === 'head' && plugin.entity) this._drawFace(body, plugin.entity);
  }

  _drawFace(head, entity) {
    const ctx = this.ctx, c = entity.controller, s = entity.rig.scale;
    const d = c ? c.dir : 1;
    const out = c && !c.conscious;
    const ca = Math.cos(head.angle), sa = Math.sin(head.angle);
    const at = (lx, ly) => ({ x: head.position.x + (lx * ca - ly * sa) * s, y: head.position.y + (lx * sa + ly * ca) * s });
    const eye = at(5 * d, -3);
    ctx.strokeStyle = ctx.fillStyle = '#1b1b1b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (out) {
      const r = 2.3 * s;
      ctx.moveTo(eye.x - r, eye.y - r); ctx.lineTo(eye.x + r, eye.y + r);
      ctx.moveTo(eye.x + r, eye.y - r); ctx.lineTo(eye.x - r, eye.y + r);
      ctx.stroke();
    } else {
      ctx.arc(eye.x, eye.y, 1.9 * s, 0, Math.PI * 2);
      ctx.fill();
    }
    const m1 = at(3 * d, 5), m2 = at(8 * d, out ? 5 : 4);
    ctx.beginPath(); ctx.moveTo(m1.x, m1.y); ctx.lineTo(m2.x, m2.y); ctx.stroke();
  }

  /** Cheap surface detail for box-shaped bodies, drawn in body space. */
  _decor(kind, part) {
    const ctx = this.ctx, v = part.vertices;
    const at = (u, w) => ({
      x: v[0].x + (v[1].x - v[0].x) * u + (v[3].x - v[0].x) * w,
      y: v[0].y + (v[1].y - v[0].y) * u + (v[3].y - v[0].y) * w,
    });
    const line = (p, q) => { ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); };
    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath();
    if (kind === 'crate') {
      const i = 0.14;
      line(at(i, i), at(1 - i, i)); line(at(1 - i, i), at(1 - i, 1 - i));
      line(at(1 - i, 1 - i), at(i, 1 - i)); line(at(i, 1 - i), at(i, i));
      line(at(i, i), at(1 - i, 1 - i)); line(at(1 - i, i), at(i, 1 - i));
      ctx.stroke();
    } else if (kind === 'bricks') {
      const len = Math.hypot(v[3].x - v[0].x, v[3].y - v[0].y);
      const rows = Math.max(1, Math.round(len / 20));
      for (let r = 1; r < rows; r++) line(at(0, r / rows), at(1, r / rows));
      ctx.stroke();
    } else if (kind === 'stripes') {
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      for (let s = 0.1; s < 1; s += 0.15) line(at(s, 0.2), at(s + 0.06, 0.8));
      ctx.stroke();
    } else if (kind === 'rivets') {
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      for (const [u, w] of [[.12, .2], [.88, .2], [.12, .8], [.88, .8]]) {
        const p = at(u, w);
        ctx.moveTo(p.x + 2.2, p.y);
        ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
      }
      ctx.fill();
    } else if (kind === 'plank') {
      line(at(0.5, 0.15), at(0.5, 0.85));
      ctx.stroke();
    }
    ctx.restore();
  }

  _drawConstraint(c) {
    if (c.render && c.render.visible === false) return;
    const a = c.bodyA ? Matter.Vector.add(c.bodyA.position, c.pointA) : c.pointA;
    const b = c.bodyB ? Matter.Vector.add(c.bodyB.position, c.pointB) : c.pointB;
    if (!a || !b) return;
    const ctx = this.ctx;
    if (c.render && c.render.anchor) {
      ctx.beginPath();
      ctx.arc(a.x, a.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#c9ced8';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineWidth = (c.render && c.render.lineWidth) || 1.5;
    ctx.strokeStyle = (c.render && c.render.strokeStyle) || 'rgba(200,210,230,.5)';
    ctx.stroke();
    if (c.plugin && c.plugin.grab) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#4f9dff';
      ctx.fill();
    }
  }

  _outline(entity, color, width) {
    const ctx = this.ctx;
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    for (const b of Composite.allBodies(entity.composite)) for (const p of bodyParts(b)) { this._partPath(p); ctx.stroke(); }
  }

  _drawWind(dt, w, h) {
    const s = this.app.tools.windNow;
    if (!s) return;
    const ctx = this.ctx;
    const speed = s * 0.012 * (this.physics.paused ? 0 : PARAMS.timeScale);
    ctx.strokeStyle = `rgba(190,215,255,${Math.min(0.35, Math.abs(s) / 250)})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const p of this.windParticles) {
      p.x += speed * dt * p.l;
      if (p.x > 1.05) { p.x = -0.05; p.y = Math.random(); }
      if (p.x < -0.05) { p.x = 1.05; p.y = Math.random(); }
      const x = p.x * w, y = p.y * this.physics.groundTop, len = Math.sign(s) * (10 + Math.abs(s) * 0.4) * p.l;
      ctx.moveTo(x, y);
      ctx.lineTo(x - len, y);
    }
    ctx.stroke();
  }

  _drawEffects() {
    const ctx = this.ctx;
    for (const e of this.app.tools.effects) {
      if (e.kind !== 'explosion') continue;
      const k = e.t / e.life;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * (0.25 + 0.75 * k), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,160,60,${1 - k})`;
      ctx.lineWidth = 4 * (1 - k) + 1;
      ctx.stroke();
      if (k < 0.4) {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * 0.35 * (1 - k / 0.4) + 6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,220,120,${0.7 * (1 - k / 0.4)})`;
        ctx.fill();
      }
    }
  }
}

/* =====================================================================
 * UIManager — builds panels from the definition tables and keeps the
 * controls in sync with the simulation.
 * ===================================================================== */
function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c != null) e.append(c);
  return e;
}

/** Labelled range slider. `fmt` formats the slider value; `onInput` receives it. */
function slider({ label, min, max, step, value, fmt, onInput }) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step });
  input.value = value;
  input.addEventListener('input', () => { const v = parseFloat(input.value); out.textContent = fmt(v); onInput(v); });
  const row = el('div', { class: 'row' }, [el('label', { text: label }), out, input]);
  return { row, input, out, set(v) { input.value = v; out.textContent = fmt(v); } };
}

function checkbox(label, checked, onChange) {
  const input = el('input', { type: 'checkbox' });
  input.checked = checked;
  input.addEventListener('change', () => onChange(input.checked));
  return el('label', { class: 'check' }, [input, el('span', { text: label })]);
}

// Mass slider uses a log scale so both feathers and anvils are editable.
const MASS_MIN = 0.05, MASS_MAX = 500;
const massToSlider = (m) => Math.log(clamp(m, MASS_MIN, MASS_MAX) / MASS_MIN) / Math.log(MASS_MAX / MASS_MIN);
const sliderToMass = (v) => MASS_MIN * Math.pow(MASS_MAX / MASS_MIN, v);

const SIZE_FIELDS = {
  w:     { label: 'Width',  min: 10,  max: 800, step: 1,    fmt: v => Math.round(v) + ' px' },
  h:     { label: 'Height', min: 8,   max: 400, step: 1,    fmt: v => Math.round(v) + ' px' },
  r:     { label: 'Radius', min: 5,   max: 150, step: 1,    fmt: v => Math.round(v) + ' px' },
  scale: { label: 'Size',   min: 0.5, max: 2,   step: 0.05, fmt: v => v.toFixed(2) + '×' },
};

class UIManager {
  constructor(app) {
    this.app = app;
    this.$ = (id) => document.getElementById(id);
    this.viewport = this.$('viewport');
    this.paramSliders = {};
    this.envSliders = {};
    this._fpsFrames = 0;
    this._fpsTime = 0;
    this._slowTime = 0;
    this._build();
  }

  _build() {
    const app = this.app, $ = this.$;

    // Toolbar
    $('btn-play').addEventListener('click', () => app.togglePause());
    $('btn-step').addEventListener('click', () => app.stepOnce());
    $('btn-reset').addEventListener('click', () => app.reset());
    $('btn-wind').addEventListener('click', () => app.tools.toggleWind());
    for (const [key, t] of Object.entries(TOOLS)) {
      $('tool-group').append(el('button', { class: 'btn', 'data-tool': key, title: `${t.label} (${t.key})`,
        onclick: () => app.tools.setTool(key) }, [`${t.icon} `, el('span', { class: 'lbl', text: t.label })]));
    }
    const presetSel = $('sel-preset');
    for (const [key, p] of Object.entries(PHYSICS_PRESETS)) presetSel.append(el('option', { value: key, text: p.label }));
    presetSel.append(el('option', { value: 'custom', text: 'Custom', disabled: '' }));
    presetSel.addEventListener('change', () => app.presets.apply(presetSel.value));
    $('btn-left').addEventListener('click', () => { $('left').classList.toggle('open'); $('right').classList.remove('open'); });
    $('btn-right').addEventListener('click', () => { $('right').classList.toggle('open'); $('left').classList.remove('open'); });

    // Spawn list (generated from OBJECT_DEFS)
    for (const [key, def] of Object.entries(OBJECT_DEFS)) {
      if (def.character) continue;
      $('spawn-list').append(el('button', { class: 'btn', 'data-spawn': key, title: `Spawn ${def.label} (click in the world to place)`,
        text: `${def.icon} ${def.label}`, onclick: () => this._toggleSpawn(key) }));
    }
    $('btn-clear').addEventListener('click', () => app.clearAll());
    $('btn-spawn-ragdoll').addEventListener('click', () => this._toggleSpawn('ragdoll'));

    // Characters
    const allSel = $('sel-all-mode');
    allSel.append(el('option', { value: '', text: '— choose —' }));
    for (const [k, s] of Object.entries(CHARACTER_STATES)) allSel.append(el('option', { value: k, text: `${s.icon} ${s.label}` }));
    allSel.addEventListener('change', () => {
      if (!allSel.value) return;
      for (const e of app.objects.characters()) e.controller.setMode(allSel.value);
      allSel.value = '';
      this.renderCharList(); this.renderCharPanel();
    });
    for (const [k, s] of Object.entries(CHARACTER_STATES)) {
      $('char-modes').append(el('button', { class: 'btn', 'data-mode': k, text: `${s.icon} ${s.label}`, onclick: () => {
        const c = app.selected && app.selected.controller;
        if (c) { c.setMode(k); this.renderCharPanel(); this.renderCharList(); }
      } }));
    }
    $('btn-face-left').addEventListener('click', () => this._face(-1));
    $('btn-face-right').addEventListener('click', () => this._face(1));

    // Environment: wind + explosion
    const env = $('env-controls'), tools = app.tools;
    this.envSliders.wind = slider({ label: 'Wind (← / →)', min: -150, max: 150, step: 1, value: tools.wind.strength,
      fmt: v => (v === 0 ? 'off' : (v > 0 ? '→ ' : '← ') + Math.abs(v)), onInput: v => { tools.wind.strength = v; if (v) tools.wind.last = v; this.syncEnv(); } });
    env.append(this.envSliders.wind.row);
    env.append(checkbox('Gusty wind', tools.wind.gusts, v => { tools.wind.gusts = v; }));
    env.append(el('div', { class: 'sub', text: 'Explosion tool' }));
    this.envSliders.radius = slider({ label: 'Radius', min: 40, max: 450, step: 5, value: tools.explosion.radius,
      fmt: v => v + ' px', onInput: v => { tools.explosion.radius = v; } });
    this.envSliders.strength = slider({ label: 'Strength', min: 5, max: 200, step: 1, value: tools.explosion.strength,
      fmt: v => String(v), onInput: v => { tools.explosion.strength = v; } });
    env.append(this.envSliders.radius.row, this.envSliders.strength.row);
    env.append(el('button', { class: 'btn wide', text: '💥 Explosion tool (3)', onclick: () => tools.setTool('explode') }));

    // Physics params (generated from PARAM_DEFS)
    for (const def of PARAM_DEFS) {
      const s = slider({ ...def, value: PARAMS[def.key], onInput: v => { app.physics.setParam(def.key, v); app.presets.markCustom(); } });
      this.paramSliders[def.key] = s;
      $('param-list').append(s.row);
    }
    $('btn-realistic').addEventListener('click', () => app.presets.apply('realistic'));

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.matches('input[type=text], input[type=number], select, textarea')) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      // Keep Space/Enter from also "clicking" whatever button or checkbox has focus.
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
      const toolByKey = Object.entries(TOOLS).find(([, t]) => t.key === e.key);
      if (e.code === 'Space') { e.preventDefault(); app.togglePause(); }
      else if (e.code === 'KeyR') app.reset();
      else if (e.code === 'KeyW') app.tools.toggleWind();
      else if (e.code === 'KeyQ') app.interaction.rotateSelected(-5 * DEG);
      else if (e.code === 'KeyE') app.interaction.rotateSelected(5 * DEG);
      else if (e.code === 'Delete' || e.code === 'Backspace') { if (app.selected) app.removeEntity(app.selected); }
      else if (e.code === 'Escape') { if (app.tools.spawnType) app.tools.cancelSpawn(); else app.select(null); }
      else if (toolByKey) app.tools.setTool(toolByKey[0]);
    });

    this.syncTools();
    this.syncEnv();
    this.syncPresetSelect();
    this.renderInspector();
  }

  _toggleSpawn(type) {
    const tools = this.app.tools;
    if (tools.spawnType === type) tools.cancelSpawn(); else tools.startSpawn(type);
    if (window.matchMedia('(max-width: 1000px)').matches) this.$('left').classList.remove('open');
  }

  _face(dir) {
    const c = this.app.selected && this.app.selected.controller;
    if (c) c.dir = dir;
  }

  syncPause(paused) {
    this.$('btn-play').innerHTML = paused ? '▶ <span class="lbl">Play</span>' : '⏸ <span class="lbl">Pause</span>';
    this.$('btn-play').classList.toggle('primary', !paused);
    this.$('btn-step').disabled = !paused;
    this.viewport.classList.toggle('paused', paused);
  }

  syncTools() {
    const tools = this.app.tools;
    for (const b of document.querySelectorAll('[data-tool]')) b.classList.toggle('active', !tools.spawnType && b.dataset.tool === tools.tool);
    for (const b of document.querySelectorAll('[data-spawn]')) b.classList.toggle('active', b.dataset.spawn === tools.spawnType);
    this.$('btn-spawn-ragdoll').classList.toggle('active', tools.spawnType === 'ragdoll');
    const c = this.app.canvas;
    c.classList.toggle('tool-delete', tools.tool === 'delete');
    c.classList.toggle('tool-explode', tools.tool === 'explode');
    c.classList.toggle('spawning', !!tools.spawnType);
    this.$('status-hint').textContent = tools.spawnType
      ? `Click to place ${OBJECT_DEFS[tools.spawnType].label} · right-click or Esc to stop`
      : `${TOOLS[tools.tool].label}: ${TOOLS[tools.tool].hint} · Space pause · R reset`;
  }

  syncEnv() {
    const w = this.app.tools.wind;
    this.envSliders.wind.set(w.strength);
    this.$('btn-wind').classList.toggle('active', !!w.strength);
  }

  syncParams() {
    for (const def of PARAM_DEFS) this.paramSliders[def.key].set(PARAMS[def.key]);
    this.syncPresetSelect();
  }

  syncPresetSelect() {
    this.$('sel-preset').value = this.app.presets.active;
  }

  /* ---------- Inspector ---------- */
  renderInspector() {
    const box = this.$('inspector'), app = this.app, objs = app.objects;
    box.innerHTML = '';
    this.renderCharPanel();
    this.renderCharList();
    this.massSlider = null;
    const e = app.selected;
    if (!e) { box.append(el('p', { class: 'muted', text: 'Click an object or ragdoll to inspect and edit it.' })); return; }
    const def = e.def, p = e.props, m = mat(p);

    box.append(el('div', { class: 'insp-title' }, [el('span', { text: e.name }), el('span', { class: 'muted', text: '#' + e.id })]));

    const sel = el('select', { class: 'input' });
    for (const [k, mm] of Object.entries(MATERIALS)) sel.append(el('option', { value: k, text: mm.label }));
    sel.value = p.material;
    sel.addEventListener('change', () => { objs.update(e, { material: sel.value }); this.renderInspector(); });
