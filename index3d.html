        e.ropes.forEach((line, i) => {
          const z = i ? 0.7 : -0.7, pts = line.geometry.attributes.position;
          const all = [e.posts[0], ...e.bodies, e.posts[1]];
          all.forEach((b, k) => {
            let lx = 0, ly = 0.04;
            if (b.isPost) { lx = k === 0 ? 0.35 : -0.35; ly = b.shapes[0].halfExtents.y - 0.04; }
            const w = b.pointToWorldFrame(V3(lx, ly, z));
            pts.setXYZ(k, w.x, w.y, w.z);
          });
          pts.needsUpdate = true;
        });
      }
    }

    // Drag line
    const d = this.app.interaction.drag;
    if (d && d.kind === 'dynamic') {
      const a = d.body.pointToWorldFrame(d.c.pivotA), b = this.app.interaction.mouseBody.position;
      const pts = this.dragLine.geometry.attributes.position;
      pts.setXYZ(0, a.x, a.y, a.z); pts.setXYZ(1, b.x, b.y, b.z); pts.needsUpdate = true;
      this.dragLine.geometry.computeBoundingSphere();
      this.dragLine.visible = true;
    } else this.dragLine.visible = false;

    // Effects
    for (const fx of this.effects) {
      fx.t += dt;
      const k = fx.t / fx.life;
      fx.mesh.scale.setScalar(fx.radius * (0.2 + 0.8 * Math.sqrt(k)));
      fx.mesh.material.opacity = 0.6 * (1 - k);
      fx.light.intensity = 60 * (1 - k);
    }
    this.effects = this.effects.filter(fx => {
      if (fx.t < fx.life) return true;
      this.scene.remove(fx.mesh, fx.light); fx.mesh.geometry.dispose(); fx.mesh.material.dispose(); fx.light.dispose();
      return false;
    });
    if (this.marker.visible) {
      this.markerT -= dt;
      this.marker.material.opacity = clamp(this.markerT, 0, 0.8);
      if (this.markerT <= 0) this.marker.visible = false;
    }

    // Wind particles drift with the wind
    const wind = this.app.tools.wind;
    this.windPts.visible = wind.strength > 0;
    if (this.windPts.visible && !this.app.physics.paused) {
      const a = wind.dir * DEG, vx = Math.sin(a), vz = Math.cos(a), sp = wind.strength * (this.app.tools.gustNow || 1) * dt * PARAMS.timeScale;
      const pos = this.windPts.geometry.attributes.position, A = CONFIG.ARENA;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i) + vx * sp, z = pos.getZ(i) + vz * sp;
        if (x > A) x -= 2 * A; if (x < -A) x += 2 * A; if (z > A) z -= 2 * A; if (z < -A) z += 2 * A;
        pos.setX(i, x); pos.setZ(i, z);
      }
      pos.needsUpdate = true;
    }

    // Follow cam
    if (this.app.ui.follow && sel && sel.kind === 'ragdoll') {
      const t = sel.rig.parts.torso.position;
      const goal = new THREE.Vector3(t.x, t.y, t.z);
      const delta = goal.sub(this.controls.target).multiplyScalar(Math.min(1, dt * 4));
      this.controls.target.add(delta);
      this.camera.position.add(delta);
    }
    this.controls.update();
    this.gl.render(this.scene, this.camera);
  }

  focus(e) {
    if (!e) return;
    const b = e.kind === 'ragdoll' ? e.rig.parts.torso : e.bodies[0];
    const goal = new THREE.Vector3(b.position.x, b.position.y, b.position.z);
    const off = this.camera.position.clone().sub(this.controls.target).setLength(8);
    this.controls.target.copy(goal);
    this.camera.position.copy(goal).add(off);
  }
}

/* =====================================================================
 * UIManager — sidebars, toolbar, inspector
 * ===================================================================== */
class UIManager {
  constructor(app) {
    this.app = app;
    this.$ = (id) => document.getElementById(id);
    this.follow = false;
    this._build();
  }

  _slider(parent, { label, min, max, step, value, fmt, onInput, onChange, id }) {
    const row = document.createElement('div');
    row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = label;
    const out = document.createElement('output'); out.textContent = fmt(value);
    const inp = document.createElement('input');
    Object.assign(inp, { type: 'range', min, max, step, value });
    if (id) inp.id = id;
    inp.addEventListener('input', () => { const v = parseFloat(inp.value); out.textContent = fmt(v); onInput && onInput(v); });
    if (onChange) inp.addEventListener('change', () => onChange(parseFloat(inp.value)));
    row.append(lab, out, inp);
    parent.appendChild(row);
    return { row, inp, out, set: (v) => { inp.value = v; out.textContent = fmt(v); } };
  }

  _build() {
    const app = this.app, $ = this.$;

    // Toolbar
    $('btn-play').onclick = () => this.togglePause();
    $('btn-step').onclick = () => { if (app.physics.paused) { for (let i = 0; i < 2; i++) app.physics.step(); } };
    $('btn-reset').onclick = () => app.resetScene();
    $('btn-wind').onclick = () => app.tools.toggleWind();
    const tg = $('tool-group');
    this.toolBtns = {};
    for (const [k, t] of Object.entries(TOOLS)) {
      const b = document.createElement('button');
      b.className = 'btn'; b.innerHTML = `${t.icon} <span class="lbl">${t.label}</span>`;
      b.title = `${t.label} (${t.key})`;
      b.onclick = () => app.tools.setTool(k);
      tg.appendChild(b);
      this.toolBtns[k] = b;
    }
    const sel = $('sel-preset');
    for (const [k, p] of Object.entries(PHYSICS_PRESETS)) sel.add(new Option(p.label, k));
    sel.add(new Option('Custom', 'custom'));
    sel.onchange = () => { if (sel.value !== 'custom') app.presets.apply(sel.value); };
    $('btn-left').onclick = () => { $('left').classList.toggle('open'); $('right').classList.remove('open'); };
    $('btn-right').onclick = () => { $('right').classList.toggle('open'); $('left').classList.remove('open'); };

    // Spawn list
    const sl = $('spawn-list');
    this.spawnBtns = {};
    for (const [k, d] of Object.entries(OBJECT_DEFS)) {
      const b = document.createElement('button');
      b.className = 'btn'; b.textContent = `${d.icon} ${d.label}`; b.title = `Place ${d.label} (shift-click to place several)`;
      b.onclick = () => app.tools.spawnType === k ? app.tools.cancelSpawn() : app.tools.beginSpawn(k);
      sl.appendChild(b);
      this.spawnBtns[k] = b;
    }
    $('btn-clear').onclick = () => { app.objects.clear(); this.refreshCharacters(); };
    $('btn-spawn-ragdoll').onclick = () => app.tools.spawnType === 'ragdoll' ? app.tools.cancelSpawn() : app.tools.beginSpawn('ragdoll');
    const am = $('sel-all-mode');
    am.add(new Option('—', ''));
    for (const [k, s] of Object.entries(CHARACTER_STATES)) am.add(new Option(s.label, k));
    am.onchange = () => {
      if (!am.value) return;
      for (const r of app.objects.ragdolls) r.ctrl.setMode(am.value);
      am.value = '';
      this.refreshCharacters();
    };

    // Environment
    const env = $('env-controls');
    const w = app.tools.wind;
    this.windSlider = this._slider(env, { label: 'Wind speed', min: 0, max: 40, step: 0.5, value: w.strength,
      fmt: v => v.toFixed(1) + ' m/s', onInput: v => { w.strength = v; if (v > 0) w.last = v; this.syncWindBtn(); } });
    this._slider(env, { label: 'Wind direction', min: -180, max: 180, step: 1, value: w.dir,
      fmt: v => Math.round(v) + '°', onInput: v => { w.dir = v; } });
    const gl = document.createElement('label'); gl.className = 'check';
    gl.innerHTML = '<input type="checkbox" checked> Gusts';
    gl.querySelector('input').onchange = (e) => { w.gusts = e.target.checked; };
    env.appendChild(gl);
    const ex = app.tools.explosion;
    this._slider(env, { label: 'Explosion radius', min: 1, max: 15, step: 0.1, value: ex.radius,
      fmt: v => v.toFixed(1) + ' m', onInput: v => { ex.radius = v; } });
    this._slider(env, { label: 'Explosion strength', min: 1, max: 50, step: 0.5, value: ex.strength,
      fmt: v => v.toFixed(1), onInput: v => { ex.strength = v; } });

    // Camera
    $('chk-follow').onchange = (e) => { this.follow = e.target.checked; };
    $('btn-focus').onclick = () => app.renderer.focus(app.interaction.selected);
    $('btn-cam-reset').onclick = () => app.renderer.resetCamera();

    // Physics params
    const pl = $('param-list');
    this.paramSliders = {};
    for (const d of PARAM_DEFS) {
      this.paramSliders[d.key] = this._slider(pl, { ...d, value: PARAMS[d.key],
        onInput: v => { app.physics.setParam(d.key, v); app.presets.markCustom(); } });
    }
    $('btn-realistic').onclick = () => app.presets.apply('realistic');

    // Character panel
    const cm = $('char-modes');
    this.modeBtns = {};
    for (const [k, s] of Object.entries(CHARACTER_STATES)) {
      const b = document.createElement('button');
      b.className = 'btn'; b.textContent = `${s.icon} ${s.label}`;
      b.onclick = () => { const r = this.selRagdoll(); if (r) { r.ctrl.setMode(k); this.refreshCharacters(); } };
      cm.appendChild(b);
      this.modeBtns[k] = b;
    }
    const turn = (fn) => () => { const r = this.selRagdoll(); if (r) { r.ctrl.target = null; r.ctrl.heading = normAngle(fn(r.ctrl.heading)); } };
    $('btn-turn-l').onclick = turn(h => h + Math.PI / 4);
    $('btn-turn-r').onclick = turn(h => h - Math.PI / 4);
    $('btn-face-rand').onclick = turn(() => rand(-Math.PI, Math.PI));
    $('btn-face-cam').onclick = turn(() => {
      const d = new THREE.Vector3(); app.renderer.camera.getWorldDirection(d);
      return Math.atan2(d.x, d.z);
    });

    this.syncTools();
    this.syncPresetSelect();
    this.refreshCharacters();
    this.renderInspector();
  }

  selRagdoll() {
    const s = this.app.interaction && this.app.interaction.selected;
    return s && s.kind === 'ragdoll' ? s : null;
  }

  togglePause() {
    const p = this.app.physics;
    p.paused = !p.paused;
    this.$('btn-play').innerHTML = p.paused ? '▶ <span class="lbl">Play</span>' : '⏸ <span class="lbl">Pause</span>';
    this.$('btn-play').classList.toggle('primary', !p.paused);
    this.$('btn-step').disabled = !p.paused;
    this.$('viewport').classList.toggle('paused', p.paused);
  }

  syncTools() {
    const t = this.app.tools;
    for (const [k, b] of Object.entries(this.toolBtns)) b.classList.toggle('active', !t.spawnType && t.tool === k);
    for (const [k, b] of Object.entries(this.spawnBtns)) b.classList.toggle('active', t.spawnType === k);
    this.$('btn-spawn-ragdoll').classList.toggle('active', t.spawnType === 'ragdoll');
    const c = this.app.renderer.canvas;
    c.className = t.spawnType ? 'spawning' : 'tool-' + t.tool;
    this.$('status-hint').textContent = t.spawnType
      ? `Click to place ${t.spawnType === 'ragdoll' ? 'a ragdoll' : OBJECT_DEFS[t.spawnType].label} · shift-click places several · Q/E rotates · Esc cancels`
      : TOOLS[t.tool].hint;
  }

  syncWind() { this.windSlider.set(this.app.tools.wind.strength); this.syncWindBtn(); }
  syncWindBtn() { this.$('btn-wind').classList.toggle('active', this.app.tools.wind.strength > 0); }

  syncParam(key) { const s = this.paramSliders && this.paramSliders[key]; if (s) s.set(PARAMS[key]); }
  syncParams() { for (const k in this.paramSliders) this.syncParam(k); this.syncPresetSelect(); }
  syncPresetSelect() { this.$('sel-preset').value = this.app.presets.active; }

  refreshCharacters() {
    const list = this.$('char-list'), app = this.app;
    list.innerHTML = '';
    const sel = app.interaction && app.interaction.selected;
    for (const r of app.objects.ragdolls) {
      const it = document.createElement('div');
      it.className = 'char-item' + (r === sel ? ' sel' : '');
      it.innerHTML = `<span class="dot" style="background:${r.props.shirt}"></span><span class="name"></span><span class="mode">${CHARACTER_STATES[r.ctrl.mode].label}</span><button class="x" title="Delete">✕</button>`;
      it.querySelector('.name').textContent = r.props.name;
      it.onclick = () => app.interaction.select(r);
      it.querySelector('.x').onclick = (ev) => { ev.stopPropagation(); app.objects.remove(r); this.refreshCharacters(); };
      list.appendChild(it);
    }
    if (!app.objects.ragdolls.length) list.innerHTML = '<p class="muted">No characters yet.</p>';
    const r = this.selRagdoll();
    this.$('char-panel').style.opacity = r ? 1 : 0.45;
    this.$('char-name').textContent = r ? r.props.name : 'none selected';
    for (const [k, b] of Object.entries(this.modeBtns)) { b.classList.toggle('active', !!r && r.ctrl.mode === k); b.disabled = !r; }
    for (const id of ['btn-turn-l', 'btn-turn-r', 'btn-face-cam', 'btn-face-rand']) this.$(id).disabled = !r;
    this.updateStatus();
  }

  updateStatus() {
    const r = this.selRagdoll();
    this.$('char-status').textContent = r ? `Status: ${r.ctrl.statusText()} · heading ${Math.round(r.ctrl.heading / DEG)}°` : 'Select a character to control it.';
    const o = this.app.objects;
    this.$('status-counts').textContent = `${o.ragdolls.length} ragdolls · ${o.entities.length - o.ragdolls.length} objects · ${this.app.physics.world.bodies.length} bodies`;
  }

  renderInspector() {
    const box = this.$('inspector'), app = this.app, e = app.interaction && app.interaction.selected;
    box.innerHTML = '';
    if (!e) { box.innerHTML = '<p class="muted">Click an object or ragdoll with the Grab tool to inspect it.</p>'; return; }
    const om = app.objects, p = e.props;
    const title = document.createElement('div');
    title.className = 'insp-title';
    title.innerHTML = `<span></span><button class="btn danger" style="padding:1px 8px" title="Delete (Del)">✕</button>`;
    title.querySelector('span').textContent = p.name;
    title.querySelector('button').onclick = () => { om.remove(e); this.refreshCharacters(); };
    box.appendChild(title);

    const m = mat(p);
    const info = document.createElement('p');
    info.className = 'muted'; info.style.marginBottom = '8px';
    box.appendChild(info);
    const updateInfo = () => {
      const mass = e.kind === 'ragdoll' ? e.rig.totalMass : e.bodies.reduce((s, b) => s + b.mass, 0);
      info.textContent = p.isStatic ? 'Static' : `Mass ${mass.toFixed(1)} kg`;
    };
    updateInfo();

    if (e.kind !== 'ragdoll') {
      const f = document.createElement('div'); f.className = 'field';
      f.innerHTML = '<label>Material</label>';
      const s = document.createElement('select'); s.className = 'input';
      for (const [k, mm] of Object.entries(MATERIALS)) s.add(new Option(mm.label, k));
      s.value = p.material;
      s.onchange = () => { om.setProp(e, 'material', s.value); this.renderInspector(); };
      f.appendChild(s); box.appendChild(f);

      const st = document.createElement('label'); st.className = 'check';
      st.innerHTML = `<input type="checkbox" ${p.isStatic ? 'checked' : ''}> Static (fixed in place)`;
      st.querySelector('input').onchange = (ev) => { om.setProp(e, 'isStatic', ev.target.checked); this.renderInspector(); };
      box.appendChild(st);

      if (!p.isStatic) {
        const curMass = e.bodies[0].mass;
        this._slider(box, { label: 'Mass', min: 0.5, max: Math.max(1000, curMass), step: 0.5, value: curMass,
          fmt: v => v.toFixed(1) + ' kg', onInput: v => { om.setProp(e, 'mass', v); updateInfo(); } });
      }
      if (e.kind === 'object') {
        const sizeFmt = v => v.toFixed(2) + ' m';
        if (p.shape === 'box') {
          ['Width', 'Height', 'Depth'].forEach((lab, i) => this._slider(box, { label: lab, min: 0.1, max: 8, step: 0.05,
            value: p.size[i], fmt: sizeFmt, onInput: v => { om.setProp(e, 's' + 'xyz'[i], v); updateInfo(); } }));
        } else {
          this._slider(box, { label: 'Radius', min: 0.1, max: 2, step: 0.02, value: p.radius, fmt: sizeFmt,
            onInput: v => { om.setProp(e, 'radius', v); updateInfo(); } });
          if (p.shape === 'cylinder') this._slider(box, { label: 'Height', min: 0.1, max: 4, step: 0.05, value: p.height, fmt: sizeFmt,
            onInput: v => { om.setProp(e, 'height', v); updateInfo(); } });
        }
        if (p.isStatic) {
          this._slider(box, { label: 'Rotation (Q/E)', min: -180, max: 180, step: 1, value: (p.yaw || 0) / DEG,
            fmt: v => Math.round(v) + '°', onInput: v => om.setProp(e, 'yaw', v * DEG) });
          this._slider(box, { label: 'Tilt', min: -60, max: 60, step: 1, value: p.tilt || 0,
            fmt: v => Math.round(v) + '°', onInput: v => om.setProp(e, 'tilt', v) });
        }
      }
    } else {
      this._slider(box, { label: 'Size (rebuilds)', min: 0.5, max: 2, step: 0.05, value: e.rig.scale, fmt: v => '×' + v.toFixed(2),
        onChange: v => om.setProp(e, 'scale', v) });
      this._slider(box, { label: 'Muscle strength', min: 0, max: 2, step: 0.05, value: e.ctrl.muscle, fmt: v => '×' + v.toFixed(2),
        onInput: v => om.setProp(e, 'muscle', v) });
    }
    this._slider(box, { label: 'Friction', min: 0, max: 1.5, step: 0.01, value: p.friction ?? m.friction,
      fmt: v => v.toFixed(2), onInput: v => om.setProp(e, 'friction', v) });
    this._slider(box, { label: 'Bounciness', min: 0, max: 0.98, step: 0.01, value: p.restitution ?? m.restitution,
      fmt: v => v.toFixed(2), onInput: v => om.setProp(e, 'restitution', v) });
  }
}

/* =====================================================================
 * App — wiring, default scene, main loop, keyboard
 * ===================================================================== */
class App {
  constructor() {
    const canvas = document.getElementById('world');
    this.physics = new PhysicsManager(this);
    this.renderer = new Renderer(this, canvas);
    this.objects = new ObjectManager(this);
    this.presets = new PresetManager(this);
    this.tools = new ToolManager(this);
    this.interaction = new InteractionManager(this);
    this.ui = new UIManager(this);

    this.physics.on('prestep', (dt) => {
      this.tools.applyWind(dt);
      this.presets.tick(dt);
      for (const r of this.objects.ragdolls) r.ctrl.update(dt);
    });
    this.physics.on('poststep', () => this._footContacts());

    const vp = document.getElementById('viewport');
    new ResizeObserver(() => this.renderer.resize(vp.clientWidth, vp.clientHeight)).observe(vp);
    this.renderer.resize(vp.clientWidth, vp.clientHeight);
    window.addEventListener('keydown', (e) => this._key(e));

    this.resetScene();
    this.last = performance.now();
    this.fpsT = 0; this.fpsN = 0; this.uiT = 0;
    requestAnimationFrame((t) => this._frame(t));
    window.__sandboxReady = true;
    window.sandbox = this; // handy for debugging in the console
  }

  /** Mark ragdolls whose feet touch something below them (supports standing). */
  _footContacts() {
    for (const r of this.objects.ragdolls) r.ctrl.footDown = false;
    const up = this.physics.up;
    for (const c of this.physics.world.contacts) {
      const a = c.bi, b = c.bj;
      for (const [foot, other, sign] of [[a, b, -1], [b, a, 1]]) {
        if (foot.partName !== 'lLegL' && foot.partName !== 'lLegR') continue;
        if (other.ragdollId === foot.ragdollId) continue;
        // c.ni points from bi to bj; normal pointing into the foot from the support:
        const nx = c.ni.x * sign, ny = c.ni.y * sign, nz = c.ni.z * sign;
        if (nx * up.x + ny * up.y + nz * up.z > 0.5) foot.entity.ctrl.footDown = true;
      }
    }
  }

  resetScene() {
    this.interaction.select(null);
    this.tools.cancelSpawn();
    this.objects.clear();
    ragdollCounter = 0;
    const O = this.objects, v = (x, y, z) => new THREE.Vector3(x, y, z);
    // A little playground
    O.spawn('ramp', v(-7, 0, -3), 0);
    O.spawn('platform', v(-3.62, 0, -3), 0);
    O.spawn('wall', v(6, 0, -6), 0.4);
    O.spawn('bouncy', v(7, 0, 3), 0);
    O.spawn('bridge', v(0, 0, -9), 0);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3 - i; j++) O.spawn('crate', v(3 + j * 0.85 + i * 0.42, i * 0.8, 1), 0);
    O.spawn('ball', v(-4, 0, 4));
    O.spawn('rubberBall', v(-3, 0, 6));
    O.spawn('barrel', v(5, 0, -2));
    O.spawn('dominoes', v(-6, 0, 8), 0);
    O.spawnRagdoll(v(-1.5, 0, 2), 0.3, 1, { mode: 'idle' });
    O.spawnRagdoll(v(1.5, 0, 3), -2.5, 1, { mode: 'walk' });
    O.spawnRagdoll(v(0, 0, 6), Math.PI, 1, { mode: 'sit' });
    O.spawnRagdoll(v(0, 1.6, -9), Math.PI / 2, 1, { mode: 'idle' });
    this.physics.acc = 0;
    this.ui.refreshCharacters();
  }

  _key(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const k = e.key.toLowerCase(), ui = this.ui, t = this.tools, it = this.interaction;
    if (k === ' ') { e.preventDefault(); ui.togglePause(); }
    else if (k === 'r') this.resetScene();
    else if (k === 'w') t.toggleWind();
    else if (k === 'escape') { t.cancelSpawn(); it.select(null); }
    else if (k === 'delete' || k === 'backspace') { if (it.selected) { this.objects.remove(it.selected); ui.refreshCharacters(); } }
    else if (k === 'q') it.rotate(1);
    else if (k === 'e') it.rotate(-1);
    else if (k === 'f') this.renderer.focus(it.selected);
    else if (k === 'c') { ui.follow = !ui.follow; document.getElementById('chk-follow').checked = ui.follow; }
    else for (const [name, tool] of Object.entries(TOOLS)) if (tool.key === k) t.setTool(name);
  }

  _frame(now) {
    const dt = Math.min(0.1, (now - this.last) / 1000);
    this.last = now;
    if (this.interaction.drag && this.interaction.drag.kind === 'dynamic') this.interaction.drag.target.copy(this.interaction._dragTarget());
    this.physics.update(dt);
    this.interaction.updateHover();
    this.renderer.render(dt);
    this.fpsT += dt; this.fpsN++; this.uiT += dt;
    if (this.fpsT >= 0.5) {
      document.getElementById('stat-fps').textContent = Math.round(this.fpsN / this.fpsT) + ' FPS';
      this.fpsT = 0; this.fpsN = 0;
    }
    if (this.uiT > 0.25) { this.uiT = 0; this.ui.updateStatus(); }
    requestAnimationFrame((t) => this._frame(t));
  }
}

new App();
